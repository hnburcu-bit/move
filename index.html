<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Move</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b2433">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Move">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#1b2433;--card:#243044;--line:#34435c;--tx:#eaf0f7;--mut:#9fb0c8;--ac:#2ec4b6;--kc:#ffb703;--bad:#ff6b6b}
*{box-sizing:border-box}
[hidden]{display:none!important}
#bg{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;background-repeat:no-repeat;transition:background-image .3s}
body{margin:0;background:#0e141d;color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:26px;margin:0 0 10px}
h2{font-size:15px;margin:20px 0 8px;color:var(--ac)}
h1,h2,.big,.m b,nav button,button.pri,.hero h1,.chips button{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.05em}
h1,.hero h1{font-weight:800}h2{font-weight:700;letter-spacing:.12em}nav button{font-size:13px;font-weight:700;letter-spacing:.03em}
textarea{width:100%;resize:vertical}
.date{width:100%;margin-bottom:6px}
input,select,button,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac)}
.row{display:flex;gap:8px;margin-bottom:8px}
.row>*{flex:1}
button.pri{background:var(--ac);color:#06201d;font-weight:700;border:0}
button.x{flex:0 0 auto;padding:4px 10px;color:var(--bad);border-color:transparent;background:none}
.card{background:rgba(36,48,68,.58);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:14px;padding:12px;margin-bottom:10px}
.item{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .n{flex:1}.item small{color:var(--mut);display:block}
.big{font-size:40px;font-weight:800;color:var(--kc);line-height:1}
.bar{height:8px;background:var(--bg);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--kc)}
.macros{display:flex;gap:14px;color:var(--mut)}.macros b{color:var(--tx)}
.prev{color:var(--kc);min-height:22px;margin-bottom:6px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(36,48,68,.94);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:14px 0;color:var(--mut)}
nav button.on{color:var(--ac);font-weight:700}
.empty{color:var(--mut);padding:6px 0}
svg{width:100%;height:auto}
#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}#login .card{width:100%;max-width:360px}.err{color:var(--bad);min-height:20px;margin:6px 0}#sync{color:var(--mut);font-size:13px;min-height:18px}
[hidden]{display:none!important}
.hero{position:relative;overflow:hidden;border-radius:16px;padding:18px;margin-bottom:12px;min-height:118px;background:linear-gradient(135deg,#1d6a73,#243044 75%)}
.hero svg{position:absolute;right:-4px;bottom:-6px;height:125%;color:rgba(255,255,255,.2)}
.hero>div{position:relative}.hero small{color:#cfe3ee}.hero h1{margin:2px 0 0;font-size:38px;line-height:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.m{background:rgba(36,48,68,.58);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:12px;padding:10px}.m b{font-size:24px}.m small{color:var(--mut);display:block}
.m small.up{color:var(--kc)}.m small.dn{color:var(--ac)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chips button{padding:6px 12px;border-radius:20px;color:var(--mut)}
.chips button.on{background:var(--ac);color:#06201d;border:0;font-weight:700}
.fld{display:block}.fld small{display:block;color:var(--mut)}.fld input{width:100%}
#lb{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
#lb img{max-width:94%;max-height:74%;border-radius:12px}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.pg div{aspect-ratio:3/4;background:var(--bg) center/cover;border-radius:10px;position:relative}
.pg small{position:absolute;left:6px;bottom:4px;text-shadow:0 1px 3px #000}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.cmp img{width:100%;border-radius:10px}.cmp small{color:var(--mut)}
.ck{min-width:112px}.ck.ok{background:var(--ac);color:#06201d;border:0;font-weight:700}.ck.no{background:var(--bad);color:#fff;border:0;font-weight:700}
.week{display:flex;gap:6px;margin:8px 0}.dy{flex:1;text-align:center;border-radius:10px;padding:6px 0;background:rgba(255,255,255,.07)}.dy small{display:block;font-size:11px;color:inherit;opacity:.8}.dy b{font-size:18px}
.dy.ok{background:var(--ac);color:#06201d}.dy.no{background:var(--bad);color:#fff}
#login{background:linear-gradient(rgba(14,20,29,.55),rgba(14,20,29,.78)),url(bg6.jpg) center/cover no-repeat,url(bg3.jpg) center/cover no-repeat;overflow:hidden}
@media (min-width:900px) and (min-aspect-ratio:1/1){#login{background-image:linear-gradient(rgba(14,20,29,.55),rgba(14,20,29,.78)),url(bg6w.jpg),url(bg3w.jpg)}}
#login .card{position:relative;z-index:1}
.fx{position:absolute;inset:0;display:grid;gap:5px;padding:5px;pointer-events:none}
.fx>i{position:relative;display:block}
.fx>i::before,.fx>i::after{content:"";position:absolute;inset:0;border-radius:9px}
.fx>i::before{background:rgba(14,20,29,.82);animation:wv 7s ease-in-out infinite;animation-delay:var(--d)}
.fx>i::after{border:1px solid rgba(46,196,182,.7);opacity:0;animation:ed 7s ease-in-out infinite;animation-delay:var(--d)}
.fx svg{position:absolute;left:22%;top:22%;width:56%;height:56%;color:rgba(46,196,182,.8);opacity:0;animation:ic 7s ease-in-out infinite;animation-delay:var(--d)}
@keyframes wv{0%,100%{opacity:1}45%,55%{opacity:.06}}
@keyframes ed{0%,100%{opacity:0}45%,55%{opacity:1}}
@keyframes ic{0%,100%{opacity:0;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1) rotate(90deg)}}
@media (prefers-reduced-motion:reduce){.fx>i::before,.fx>i::after,.fx svg{animation:none}.fx>i::before{opacity:.9}}
.bd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.b{text-align:center;padding:10px 4px;border-radius:12px;background:rgba(255,255,255,.05);opacity:.45}
.b.on{opacity:1;background:rgba(46,196,182,.16);border:1px solid rgba(46,196,182,.5)}
.b i{display:block;font-style:normal;font-size:28px;filter:grayscale(1)}.b.on i{filter:none}
.b b{display:block;font-size:13px;line-height:1.15}.b small{color:var(--mut);font-size:11px}
#mBack{margin-bottom:10px}
details summary{cursor:pointer;color:var(--mut)}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<div id="lb" hidden></div>
<main>
<div id="login" hidden><div class="fx" id="fx" aria-hidden="true"></div><div class="card"><h1>Move</h1><input id="lEm" type="email" autocomplete="username" placeholder="E-posta" style="width:100%;margin-bottom:8px"><input id="lPw" type="password" autocomplete="current-password" placeholder="Şifre" style="width:100%"><div class="err" id="lErr"></div><button class="pri" id="lGo" style="width:100%">Giriş yap</button></div></div>
<input type="date" id="date" class="date" aria-label="Tarih"><div id="sync"></div>
<section id="t-home"></section>
<section id="t-work" hidden></section>
<section id="t-food" hidden></section>
<section id="t-meas" hidden></section>
<section id="t-mem" hidden></section>
<section id="t-acc" hidden></section>
</main>
<nav>
<button data-t="home" class="on">Ana Sayfa</button>
<button data-t="work">Antrenman</button>
<button data-t="food">Yemek</button>
<button data-t="meas">Ölçüm</button>
<button data-t="mem" id="navMem" hidden>Üyeler</button>
<button data-t="acc">Hesap</button>
</nav>
<script>
// Besin değerleri: 100 gram için yaklaşık değerler [kcal, protein, karbonhidrat, yağ]
const FOODS={
"Yumurta (haşlanmış)":[143,12.6,0.7,9.5],"Tavuk göğsü (pişmiş)":[165,31,0,3.6],"Dana eti (pişmiş)":[250,26,0,15],
"Kıyma (pişmiş)":[250,25,0,16],"Somon":[208,20,0,13],"Ton balığı (suda)":[116,26,0,1],
"Pirinç pilavı (pişmiş)":[130,2.7,28,0.3],"Bulgur pilavı (pişmiş)":[83,3.1,18.6,0.2],"Makarna (pişmiş)":[158,5.8,31,0.9],
"Beyaz ekmek":[265,9,49,3.2],"Tam buğday ekmeği":[247,13,41,3.4],"Yulaf ezmesi (kuru)":[389,16.9,66,6.9],
"Süt (tam yağlı)":[61,3.2,4.8,3.3],"Yoğurt (tam yağlı)":[61,3.5,4.7,3.3],"Ayran":[38,1.7,2.9,1.9],
"Beyaz peynir":[264,14,4,21],"Lor peyniri":[98,11,3.4,4.3],
"Muz":[89,1.1,22.8,0.3],"Elma":[52,0.3,14,0.2],"Portakal":[47,0.9,11.8,0.1],
"Domates":[18,0.9,3.9,0.2],"Salatalık":[15,0.7,3.6,0.1],"Brokoli":[34,2.8,6.6,0.4],
"Patates (haşlanmış)":[87,1.9,20,0.1],"Tatlı patates":[86,1.6,20,0.1],
"Mercimek (pişmiş)":[116,9,20,0.4],"Nohut (pişmiş)":[164,8.9,27,2.6],"Kuru fasulye (pişmiş)":[127,8.7,22.8,0.5],
"Zeytinyağı":[884,0,0,100],"Zeytin":[115,0.8,6,11],"Avokado":[160,2,8.5,15],
"Fıstık ezmesi":[588,25,20,50],"Badem":[579,21,22,50],"Ceviz":[654,15,14,65],
"Bal":[304,0.3,82,0],"Sütlü çikolata":[535,7.7,59,30],"Whey protein":[400,80,8,6]
};
const LEGACY="spor-takip-v1",TK="move-session";
const EMPTY=()=>({work:{},meals:{},weights:[],custom:{},goal:2500,meas:[],profile:{},tpl:[],checks:{}});
let S=EMPTY(),SES=JSON.parse(localStorage.getItem(TK)||"null"),timer;
async function api(action,body){
  const r=await fetch("/api",{method:"POST",headers:{"Content-Type":"application/json",...(SES?{Authorization:"Bearer "+SES.token}:{})},body:JSON.stringify({action,...body})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){if(r.status===401&&SES&&action!=="login")logout();throw new Error(j.error||"Bağlantı hatası")}
  return j;
}
function save(){
  if(!SES)return;
  localStorage.setItem("move-data-"+SES.email,JSON.stringify(S));
  $("sync").textContent="Kaydediliyor...";
  clearTimeout(timer);
  timer=setTimeout(()=>api("save",{data:S}).then(()=>$("sync").textContent="Kaydedildi").catch(()=>$("sync").textContent="Kaydedilemedi, internetini kontrol et"),500);
}
function fixS(){
  S.meas=S.meas||(S.weights||[]).map(w=>({date:w.date,kg:w.kg}));
  S.profile=S.profile||{};S.tpl=S.tpl||[];S.checks=S.checks||{};
  if(SES&&!S.profile.name&&SES.name){S.profile.name=SES.name;S.profile.surname=SES.surname||""}
}
function logout(){PROG=null;DIET=undefined;MEM={list:null,sel:null,pack:null,cm:"kg"};localStorage.removeItem(TK);SES=null;S=EMPTY();$("login").hidden=false}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r1=n=>Math.round(n*10)/10;
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const allFoods=()=>({...FOODS,...S.custom});
let tab="home";
$("date").value=today();
$("date").onchange=render;
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));render()});

function render(){
  $("navMem").hidden=!(SES&&SES.admin);
  ["home","work","food","meas","mem","acc"].forEach(t=>$("t-"+t).hidden=t!==tab);
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x.dataset.t===tab));
  const bn=({home:1,work:2,food:3,meas:4,acc:5})[tab],bo=({1:.18,2:.22,3:.15,4:.42,5:.12})[bn],fb=bn===5?1:bn;
  const wd=typeof matchMedia==="function"&&matchMedia("(min-width:900px) and (min-aspect-ratio:1/1)").matches?"w":"";
  $("bg").style.backgroundImage=`linear-gradient(rgba(27,36,51,${bo}),rgba(27,36,51,${bo})),url(bg${bn}${wd}.jpg),url(bg${fb}${wd}.jpg)`;
  ({home:renderHome,work:renderWork,food:renderFood,meas:renderMeas,mem:renderMem,acc:renderAcc})[tab]();
}

/* ---------- Program ---------- */
let PROG=null;
function parseProg(t){
  const days=[];let cur=null;
  (t||"").split(/\r?\n/).map(x=>x.trim()).filter(Boolean).forEach(l=>{
    if(l[0]==="#"){cur={name:l.replace(/^#+\s*/,"")||"Gün",items:[]};days.push(cur);return}
    if(!cur){cur={name:"Program",items:[]};days.push(cur)}
    const m=l.match(/^(.+?)\s+(\d+)\s*[xX×]\s*(\d+)\s*$/);
    cur.items.push(m?{ex:m[1],sets:+m[2],reps:+m[3]}:{ex:l,sets:3,reps:10});
  });
  return days;
}
async function loadProg(){
  const box=$("progBox");if(!box)return;
  if(PROG===null){try{PROG=(await api("myprogram")).text}catch(e){PROG=""}}
  const days=parseProg(PROG),d=$("date").value;
  if(!$("progBox"))return;
  $("progBox").innerHTML=days.length?`<h2>Programım</h2>`+days.map((g,i)=>`<details class="card"><summary>${esc(g.name)} · ${g.items.length} hareket</summary>${g.items.map(x=>`<div class="item"><div class="n">${esc(x.ex)}</div><b>${x.sets}×${x.reps}</b></div>`).join("")}<button class="pri" data-i="${i}" style="width:100%;margin-top:8px">Bugüne ekle</button></details>`).join(""):"";
  document.querySelectorAll("#progBox button").forEach(b=>b.onclick=()=>{
    const g=days[+b.dataset.i];(S.work[d]=S.work[d]||[]).push(...g.items.map(i=>({ex:i.ex,sets:i.sets,reps:i.reps,kg:lastKg(i.ex)})));save();renderWork();
  });
}

/* ---------- Şablonlar ---------- */
const TPL0=[
{id:"g",name:"Göğüs + Triceps",items:[["Bench press",4,8],["Incline dumbbell press",3,10],["Cable fly",3,12],["Triceps pushdown",3,12],["Dips",3,10]]},
{id:"s",name:"Sırt + Biceps",items:[["Barfiks",4,8],["Barbell row",4,8],["Lat pulldown",3,10],["Seated row",3,12],["Biceps curl",3,12]]},
{id:"b",name:"Bacak",items:[["Squat",4,8],["Romanian deadlift",3,10],["Leg press",3,12],["Lunge",3,12],["Calf raise",4,15]]},
{id:"o",name:"Omuz + Karın",items:[["Overhead press",4,8],["Lateral raise",3,15],["Face pull",3,15],["Plank (dk)",3,1],["Leg raise",3,15]]},
{id:"f",name:"Full body",items:[["Deadlift",3,5],["Squat",3,8],["Bench press",3,8],["Barbell row",3,8],["Overhead press",3,8]]},
{id:"c",name:"CrossFit devresi",items:[["Box jump",4,10],["Kettlebell swing",4,15],["Burpee",4,12],["Thruster",4,10],["Ip atlama (dk)",4,2]]}
];
const allTpl=()=>[...TPL0.map(t=>({id:t.id,name:t.name,items:t.items.map(([ex,sets,reps])=>({ex,sets,reps,kg:0}))})),...(S.tpl||[]).map(t=>({...t,name:t.name+" (benim)"}))];
function lastKg(ex){const k=ex.toLowerCase();for(const d of Object.keys(S.work).sort().reverse()){const w=[...S.work[d]].reverse().find(x=>x.ex.toLowerCase()===k);if(w)return w.kg}return 0}

/* ---------- Antrenman ---------- */
function renderWork(){
  const d=$("date").value,list=S.work[d]||[];
  $("t-work").innerHTML=`${heroBox("run","Antrenman","Bugünkü çalışmanı kaydet")}
  <div id="progBox"></div>
  <div class="card"><b>Şablondan ekle</b><div class="row" style="margin-top:8px"><select id="tSel">${allTpl().map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select><button class="pri" id="tAdd" style="flex:0 0 auto">Ekle</button></div>
  <details><summary>Şablon kaydet / sil</summary><div class="row" style="margin-top:8px"><input id="tNm" placeholder="Şablon adı"><button id="tSave" style="flex:0 0 auto">Bugünkünü kaydet</button></div><button id="tDel" style="width:100%">Seçili şablonu sil</button></details></div>
  <div class="card">
    <input id="wEx" placeholder="Hareket (örn. Bench press)" list="exs" style="width:100%;margin-bottom:8px">
    <datalist id="exs">${[...new Set(Object.values(S.work).flat().map(w=>w.ex))].map(e=>`<option value="${esc(e)}">`).join("")}</datalist>
    <div class="row"><input id="wSet" type="number" inputmode="numeric" placeholder="Set"><input id="wRep" type="number" inputmode="numeric" placeholder="Tekrar"><input id="wKg" type="number" inputmode="decimal" placeholder="Kg"></div>
    <button class="pri" id="wAdd" style="width:100%">Hareketi ekle</button>
  </div>
  <div class="card">${list.length?list.map((w,i)=>`<div class="item"><div class="n">${esc(w.ex)}<small>${w.sets} set × ${w.reps} tekrar · ${w.kg} kg · hacim ${w.sets*w.reps*w.kg} kg</small></div><button class="x" data-i="${i}" aria-label="Sil">Sil</button></div>`).join(""):`<div class="empty">Bu gün için hareket yok. Yukarıdan ilk hareketi ekle.</div>`}</div>`;
  $("wAdd").onclick=()=>{
    const ex=$("wEx").value.trim(),sets=+$("wSet").value,reps=+$("wRep").value,kg=+$("wKg").value||0;
    if(!ex||!sets||!reps)return alert("Hareket adı, set ve tekrar gerekli.");
    (S.work[d]=S.work[d]||[]).push({ex,sets,reps,kg});save();renderWork();
  };
  loadProg();
  $("tAdd").onclick=()=>{
    const t=allTpl().find(x=>x.id===$("tSel").value);if(!t)return;
    (S.work[d]=S.work[d]||[]).push(...t.items.map(i=>({ex:i.ex,sets:i.sets,reps:i.reps,kg:lastKg(i.ex)||i.kg||0})));save();renderWork();
  };
  $("tSave").onclick=()=>{
    const n=$("tNm").value.trim();if(!n||!list.length)return alert("Önce bugüne hareket ekle ve şablona bir ad yaz.");
    S.tpl=(S.tpl||[]).concat([{id:"u"+Date.now(),name:n,items:list.map(({ex,sets,reps,kg})=>({ex,sets,reps,kg}))}]);save();renderWork();
  };
  $("tDel").onclick=()=>{
    const id=$("tSel").value;if(id[0]!=="u")return alert("Hazır şablonlar silinemez, sadece kendi kaydettiklerin silinir.");
    S.tpl=S.tpl.filter(x=>x.id!==id);save();renderWork();
  };
  document.querySelectorAll("#t-work .x").forEach(b=>b.onclick=()=>{S.work[d].splice(+b.dataset.i,1);save();renderWork()});
}

/* ---------- Yemek ---------- */
function calc(name,g){const f=allFoods()[name];if(!f)return null;const k=g/100;return{kcal:Math.round(f[0]*k),p:r1(f[1]*k),c:r1(f[2]*k),f:r1(f[3]*k)}}
function renderFood(){
  const d=$("date").value,list=S.meals[d]||[];
  const T=list.reduce((a,m)=>({kcal:a.kcal+m.kcal,p:a.p+m.p,c:a.c+m.c,f:a.f+m.f}),{kcal:0,p:0,c:0,f:0});
  const G=(DIET&&DIET.kcal)||S.goal;if(DIET===undefined)loadDiet();const pct=Math.min(100,T.kcal/G*100);
  const meals=["Kahvaltı","Öğle","Akşam","Ara öğün"];
  $("t-food").innerHTML=`<h1>Yemek</h1>
  <div class="card"><div class="big">${T.kcal}<small style="font-size:16px;color:var(--mut);font-weight:400"> / ${G} kcal</small></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="macros"><span>Protein <b>${r1(T.p)} g</b></span><span>Karb. <b>${r1(T.c)} g</b></span><span>Yağ <b>${r1(T.f)} g</b></span></div>

function chartSvgS(s){
  if(s.length<2)return `<div class="empty">Grafik için bu ölçümden en az 2 kayıt gir.</div>`;
  const v=s.map(x=>x.v),mn=Math.min(...v),mx=Math.max(...v),pad=(mx-mn)||1,lo=mn-pad*.25,hi=mx+pad*.25,W=320,H=150;

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ölçüm grafiği"><polyline fill="none" stroke="#2ec4b6" stroke-width="3" points="${pts.map(p=>p.join(",")).join(" ")}"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#2ec4b6"/><text x="${p[0]}" y="${p[1]-8}" text-anchor="middle" font-size="10" fill="#eaf0f7">${v[i]}</text>`).join("")}<text x="2" y="${H-4}" font-size="10" fill="#9fb0c8">${s[0].date.slice(5)}</text><text x="${W-2}" y="${H-4}" text-anchor="end" font-size="10" fill="#9fb0c8">${s[s.length-1].date.slice(5)}</text></svg>`;

/* ---------- Rozetler ---------- */
const isoD=x=>new Date(x-x.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const BADGES=[
 ["🏁","İlk adım","İlk antrenmanını kaydet",s=>s.wd,1],
 ["💪","10 antrenman","10 antrenman günü",s=>s.wd,10],
 ["🏆","50 antrenman","50 antrenman günü",s=>s.wd,50],
 ["🔥","7 gün seri","Üst üste 7 gün antrenman",s=>s.best,7],
 ["⚡","30 gün seri","Üst üste 30 gün antrenman",s=>s.best,30],
 ["🥗","3 disiplinli gün","3 gün tüm öğünleri yedim",s=>s.disc,3],
 ["🥇","10 disiplinli gün","10 gün tüm öğünler",s=>s.disc,10],
 ["📏","İlk ölçüm","İlk ölçümünü gir",s=>s.meas,1],
 ["📈","5 ölçüm","5 ölçüm kaydı",s=>s.meas,5],
 ["🚀","İlk rekor","Bir harekette rekor kır",s=>s.pr,1],
 ["💥","10 rekor","10 rekor kır",s=>s.pr,10],
 ["🙋","Profil tamam","Ad, soyad ve boyunu gir",s=>s.prof,1]
];
function stats(D){
  const ck=D.checks||{},wk=D.work||{},days=new Set();
  Object.keys(wk).forEach(d=>{if((wk[d]||[]).length)days.add(d)});
  Object.keys(ck).forEach(d=>{if(ck[d].w===true)days.add(d);else if(ck[d].w===false)days.delete(d)});
  let best=0,run=0,prev=null;
  [...days].sort().forEach(d=>{run=prev&&(new Date(d)-new Date(prev))===864e5?run+1:1;best=Math.max(best,run);prev=d});
  let cur=0;const c=new Date();if(!days.has(isoD(c)))c.setDate(c.getDate()-1);
  while(days.has(isoD(c))){cur++;c.setDate(c.getDate()-1)}
  let disc=0;Object.values(ck).forEach(x=>{const m=x.m||{};if(MEALS.every(k=>m[k]===true))disc++});
  const mx={};let pr=0;
  Object.keys(wk).sort().forEach(d=>(wk[d]||[]).forEach(e=>{const k=String(e.ex).toLowerCase(),kg=+e.kg||0;if(kg>0){if(mx[k]!==undefined&&kg>mx[k])pr++;mx[k]=Math.max(mx[k]||0,kg)}}));
  const P=D.profile||{};
  return{wd:days.size,best,cur,disc,pr,meas:(D.meas||[]).length,prof:(P.name&&P.surname&&P.boy)?1:0};
}
function badgeCard(D){
  const s=stats(D),L=BADGES.map(([ic,n,ds,f,g])=>({ic,n,ds,v:f(s),g})),got=L.filter(b=>b.v>=b.g).length;
  return `<h2>Rozetler · ${got}/${L.length}</h2><div class="card"><div class="macros" style="margin-bottom:8px"><span>🔥 Şu anki seri <b>${s.cur} gün</b></span><span>En uzun seri <b>${s.best} gün</b></span></div><div class="bd">${L.map(b=>`<div class="b ${b.v>=b.g?"on":""}" title="${esc(b.ds)}"><i>${b.ic}</i><b>${esc(b.n)}</b><small>${b.v>=b.g?"Kazanıldı":Math.min(b.v,b.g)+" / "+b.g}</small></div>`).join("")}</div></div>`;
}

    document.querySelectorAll("#mlist .item").forEach(it=>it.onclick=()=>{MEM.sel=L[+it.dataset.i];MEM.pack=null;renderMem()});
    return;
  }
  const m=MEM.sel,E=m.email,back=()=>{MEM.sel=null;MEM.pack=null;renderMem()};
  if(!MEM.pack){
    el.innerHTML=`<button id="mBack">‹ Üye listesi</button><div class="empty">Yükleniyor...</div>`;$("mBack").onclick=back;
    try{
      let D;
      if(m.self)D=S;else{
        D=(await api("memberdata",{email:E})).data||EMPTY();
        D.profile=D.profile||{};D.meas=D.meas||[];D.work=D.work||{};D.meals=D.meals||{};D.checks=D.checks||{};
        if(!D.profile.name){D.profile.name=m.name;D.profile.surname=m.surname}
      }
      MEM.pack={D,pt:(await api("getprogram",{email:E})).text,dt:(await api("getdiet",{email:E})).diet};
    }catch(e){el.innerHTML=`<button id="mBack">‹ Üye listesi</button><div class="err">${esc(e.message)}</div>`;$("mBack").onclick=back;return}
    if(MEM.sel!==m)return;
  }
  const {D,pt,dt}=MEM.pack,P=D.profile||{},nm=[P.name,P.surname].filter(Boolean).join(" ")||E,st=stats(D);
  const ser=k=>[...(D.meas||[])].sort((a,b)=>a.date.localeCompare(b.date)).filter(x=>x[k]!=null&&x[k]!=="").map(x=>({date:x.date,v:+x[k]}));
  const have=MET.filter(([k])=>ser(k).length);if(have.length&&!have.some(h=>h[0]===MEM.cm))MEM.cm=have[0][0];
  const cards=MET.map(([k,l,u])=>{const s=ser(k);if(!s.length)return"";const a=s[s.length-1],b=s[s.length-2],d=b?r1(a.v-b.v):null;
    return `<div class="m"><small>${l}</small><div><b>${a.v}</b> ${u}</div><small class="${d>0?"up":d<0?"dn":""}">${d===null?"ilk ölçüm":d===0?"değişim yok":(d>0?"▲ +":"▼ ")+d+" "+u}</small></div>`}).join("");
  const dd=[];for(let i=6;i>=0;i--){const t=new Date();t.setDate(t.getDate()-i);dd.push(isoD(t))}
  const wk=dd.map(x=>{const c=(D.checks||{})[x]||{};return[new Date(x).toLocaleDateString("tr-TR",{weekday:"short"}),c.w===true||(c.w==null&&((D.work||{})[x]||[]).length)?"ok":c.w===false?"no":""]});
  let ate=0,miss=0;dd.forEach(x=>Object.values(((D.checks||{})[x]||{}).m||{}).forEach(v=>{if(v===true)ate++;else if(v===false)miss++}));
  const wd=Object.keys(D.work||{}).filter(d=>(D.work[d]||[]).length).sort().reverse().slice(0,4);
  const md=Object.keys(D.meals||{}).filter(d=>(D.meals[d]||[]).length).sort().reverse().slice(0,3);
  const got=BADGES.filter(([ic,n,ds,f,g])=>f(st)>=g).length;
  el.innerHTML=`<button id="mBack">‹ Üye listesi</button>
  <h1>${esc(nm)}</h1><small style="color:var(--mut)">${esc(E)}${P.boy?" · "+P.boy+" cm":""}</small>
  <div class="card" style="margin-top:8px"><div class="macros"><span>🔥 Seri <b>${st.cur} gün</b></span><span>Antrenman günü <b>${st.wd}</b></span><span>Rozet <b>${got}/${BADGES.length}</b></span></div></div>
  <h2>Son 7 gün</h2><div class="card"><div class="week">${wk.map(w=>`<div class="dy ${w[1]}"><small>${w[0]}</small><b>${w[1]==="ok"?"✓":w[1]==="no"?"✗":"·"}</b></div>`).join("")}</div><div class="macros"><span>Antrenman <b>${wk.filter(w=>w[1]==="ok").length}/7 gün</b></span><span>Öğün <b>${ate} yendi, ${miss} atlandı</b></span></div></div>
  <h2>Ölçümler</h2>${have.length?`<div class="grid">${cards}</div><div class="card" style="margin-top:8px"><div class="chips">${have.map(([k,l])=>`<button data-k="${k}" class="${k===MEM.cm?"on":""}">${l}</button>`).join("")}</div>${chartSvgS(ser(MEM.cm))}</div>`:`<div class="card"><div class="empty">Henüz ölçüm yok.</div></div>`}
  <h2>Son antrenmanlar</h2><div class="card">${wd.length?wd.map(d=>`<div class="item"><div class="n"><b>${d}</b><small>${D.work[d].map(e=>esc(e.ex)+" "+e.sets+"×"+e.reps+(e.kg?" · "+e.kg+" kg":"")).join("<br>")}</small></div></div>`).join(""):`<div class="empty">Kayıt yok.</div>`}</div>
  <h2>Son beslenme</h2><div class="card">${md.length?md.map(d=>{const L=D.meals[d],k=L.reduce((a,x)=>a+x.kcal,0),pp=L.reduce((a,x)=>a+x.p,0);return `<div class="item"><div class="n"><b>${d}</b> · ${k} kcal · P ${r1(pp)} g<small>${L.map(x=>esc(x.name)+" "+x.g+" g").join(", ")}</small></div></div>`}).join(""):`<div class="empty">Kayıt yok.</div>`}</div>
  <h2>Fotoğraflar</h2><div class="card"><div class="pg" id="mpg">Yükleniyor...</div></div>
  <h2>Antrenman programı</h2><div class="card"><textarea id="mpT" rows="8" placeholder="# Göğüs günü&#10;Bench press 4x8&#10;Incline press 3x10&#10;# Bacak günü&#10;Squat 5x5">${esc(pt||"")}</textarea><small style="color:var(--mut)"># ile gün başlığı, hareketleri "Hareket 4x8" biçiminde yaz.</small><div class="err" id="mpE"></div><button class="pri" id="mpS" style="width:100%">Programı kaydet</button></div>
  <h2>Beslenme programı</h2><div class="card"><div class="grid"><label class="fld"><small>Kalori hedefi</small><input id="dK" type="number" inputmode="numeric" value="${dt&&dt.kcal||""}"></label><label class="fld"><small>Protein (g)</small><input id="dP" type="number" inputmode="numeric" value="${dt&&dt.p||""}"></label><label class="fld"><small>Karbonhidrat (g)</small><input id="dC" type="number" inputmode="numeric" value="${dt&&dt.c||""}"></label><label class="fld"><small>Yağ (g)</small><input id="dF" type="number" inputmode="numeric" value="${dt&&dt.f||""}"></label></div><textarea id="dT" rows="7" style="margin-top:8px" placeholder="Kahvaltı: 3 yumurta, 60 g yulaf&#10;Öğle: 150 g tavuk, pilav, salata&#10;Akşam: ...">${esc((dt&&dt.text)||"")}</textarea><div class="err" id="dE"></div><button class="pri" id="dS" style="width:100%">Beslenme programını kaydet</button></div>
  ${badgeCard(D)}`;
  $("mBack").onclick=back;
  document.querySelectorAll("#t-mem .chips button").forEach(b=>b.onclick=()=>{MEM.cm=b.dataset.k;renderMem()});
  const say=(id,ok,msg)=>{$(id).style.color=ok?"var(--ac)":"var(--bad)";$(id).textContent=msg};
  $("mpS").onclick=async()=>{try{const t=$("mpT").value;await api("setprogram",{email:E,text:t});MEM.pack.pt=t;if(m.self)PROG=t;say("mpE",1,"Program kaydedildi")}catch(e){say("mpE",0,e.message)}};
  $("dS").onclick=async()=>{try{const x={kcal:$("dK").value,p:$("dP").value,c:$("dC").value,f:$("dF").value,text:$("dT").value};await api("setdiet",{email:E,diet:x});MEM.pack.dt={kcal:+x.kcal||0,p:+x.p||0,c:+x.c||0,f:+x.f||0,text:x.text};if(m.self)DIET=undefined;say("dE",1,"Beslenme programı kaydedildi")}catch(e){say("dE",0,e.message)}};
  loadMemPhotos(E);
}

/* ---------- Hesap ---------- */
async function renderAcc(){
  $("t-acc").innerHTML=`<h1>Hesap</h1><div class="card"><div class="item"><div class="n">${esc(SES.email)}<small>${SES.admin?"Yönetici":"Kullanıcı"}</small></div></div><button id="out" style="width:100%">Çıkış yap</button></div>`+(SES.admin?`<div class="card"><b>Yeni kullanıcı ekle</b><div class="row" style="margin:8px 0"><input id="nNm" placeholder="Ad"><input id="nSn" placeholder="Soyad"></div><input id="nEm" type="email" placeholder="E-posta" style="width:100%;margin-bottom:8px"><input id="nPw" type="text" placeholder="Şifre (en az 6 karakter)" style="width:100%;margin-bottom:8px"><div class="err" id="nErr"></div><button class="pri" id="nAdd" style="width:100%">Kullanıcıyı ekle</button></div><div class="card"><b>Kullanıcılar</b><div id="ulist" class="empty">Yükleniyor...</div></div>`:"");
  $("out").onclick=logout;
  if(!SES.admin)return;
  const list=async()=>{try{const j=await api("users");$("ulist").innerHTML=j.users.length?j.users.map(u=>`<div class="item"><div class="n">${esc(u)}</div></div>`).join(""):"Henüz kullanıcı yok."}catch(e){$("ulist").textContent=e.message}};
  list();
  $("nAdd").onclick=async()=>{
    $("nErr").textContent="";
    try{await api("adduser",{name:$("nNm").value,surname:$("nSn").value,email:$("nEm").value,password:$("nPw").value});$("nNm").value="";$("nSn").value="";$("nEm").value="";$("nPw").value="";$("nErr").style.color="var(--ac)";$("nErr").textContent="Kullanıcı eklendi";list()}
    catch(e){$("nErr").style.color="var(--bad)";$("nErr").textContent=e.message}
  };
}

/* ---------- Giriş sahnesi (kare kare dalga) ---------- */
(function(){
  const I=[
   '<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="7"><circle cx="50" cy="50" r="42"/><circle cx="50" cy="50" r="27"/><circle cx="50" cy="50" r="8" fill="currentColor"/></svg>',
   '<svg viewBox="0 0 160 60" fill="currentColor"><rect x="4" y="8" width="16" height="44" rx="4"/><rect x="24" y="14" width="14" height="32" rx="4"/><rect x="38" y="26" width="84" height="8" rx="3"/><rect x="122" y="14" width="14" height="32" rx="4"/><rect x="140" y="8" width="16" height="44" rx="4"/></svg>',
   '<svg viewBox="0 0 100 110" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round"><path d="M32 40C28 8 72 8 68 40"/><circle cx="50" cy="72" r="30" fill="currentColor" stroke="none"/></svg>'
  ];
  function build(){
    const W=typeof innerWidth==="number"?innerWidth:390,H=typeof innerHeight==="number"?innerHeight:800,z=W>=900?100:62;
    const cols=Math.max(3,Math.round(W/z)),rows=Math.max(3,Math.round(H/z)),f=$("fx");
    f.style.gridTemplateColumns=`repeat(${cols},1fr)`;f.style.gridTemplateRows=`repeat(${rows},1fr)`;
    let h="";
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const n=r*cols+c;h+=`<i style="--d:${((c+r)*.2).toFixed(2)}s">${(n*7+r*3)%9===0?I[(n+r)%3]:""}</i>`}
    f.innerHTML=h;
  }
  build();
  if(typeof addEventListener==="function"){let t;addEventListener("resize",()=>{clearTimeout(t);t=setTimeout(build,300)})}
})();

/* ---------- Giriş ---------- */
$("lGo").onclick=async()=>{
  $("lErr").textContent="";
  try{
    const j=await api("login",{email:$("lEm").value,password:$("lPw").value});
    SES={token:j.token,email:j.email,admin:j.admin,name:j.name||"",surname:j.surname||""};tab="home";localStorage.setItem(TK,JSON.stringify(SES));
    $("lPw").value="";start();
  }catch(e){$("lErr").textContent=e.message}
};
async function start(){
  if(!SES){$("login").hidden=false;return}
  $("login").hidden=true;
  const c=localStorage.getItem("move-data-"+SES.email);
  S=c?JSON.parse(c):EMPTY();fixS();render();
  try{
    const j=await api("load");
    if(j.data){S=j.data;localStorage.setItem("move-data-"+SES.email,JSON.stringify(S))}
    else if(SES.admin&&localStorage.getItem(LEGACY)){S=JSON.parse(localStorage.getItem(LEGACY));save()}
    else save();
    fixS();$("sync").textContent="";render();
  }catch(e){$("sync").textContent="Çevrimdışı, kayıtlar telefondan gösteriliyor"}
}
start();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
