[hidden]{display:none!important}
#bg{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;background-repeat:no-repeat;transition:background-image .3s}

main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:26px;margin:0 0 10px}
h2{font-size:15px;margin:20px 0 8px;color:var(--ac)}

textarea{width:100%;resize:vertical}
.date{width:100%;margin-bottom:6px}
input,select,button,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}

.row{display:flex;gap:8px;margin-bottom:8px}

.big{font-size:40px;font-weight:800;color:var(--kc);line-height:1}

.empty{color:var(--mut);padding:6px 0}
svg{width:100%;height:auto}

[hidden]{display:none!important}
.hero{position:relative;overflow:hidden;border-radius:16px;padding:18px;margin-bottom:12px;min-height:118px;background:linear-gradient(135deg,#1d6a73,#243044 75%)}
.hero svg{position:absolute;right:-4px;bottom:-6px;height:125%;color:rgba(255,255,255,.2)}
.hero>div{position:relative}.hero small{color:#cfe3ee}.hero h1{margin:2px 0 0;font-size:38px;line-height:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.m small.up{color:var(--kc)}.m small.dn{color:var(--ac)}

.fld{display:block}.fld small{display:block;color:var(--mut)}.fld input{width:100%}

#lb img{max-width:94%;max-height:74%;border-radius:12px}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.pg div{aspect-ratio:3/4;background:var(--bg) center/cover;border-radius:10px;position:relative}
.pg small{position:absolute;left:6px;bottom:4px;text-shadow:0 1px 3px #000}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.cmp img{width:100%;border-radius:10px}.cmp small{color:var(--mut)}
.ck{min-width:112px}.ck.ok{background:var(--ac);color:#06201d;border:0;font-weight:700}.ck.no{background:var(--bad);color:#fff;border:0;font-weight:700}

.dy.ok{background:var(--ac);color:#06201d}.dy.no{background:var(--bad);color:#fff}

@media (min-width:900px) and (min-aspect-ratio:1/1){#login{background-image:linear-gradient(rgba(14,20,29,.55),rgba(14,20,29,.78)),url(bg6w.jpg),url(bg3w.jpg)}}
#login .card{position:relative;z-index:1}
.fx{position:absolute;inset:0;display:grid;gap:5px;padding:5px;pointer-events:none}
.fx>i{position:relative;display:block}
.fx>i::before,.fx>i::after{content:"";position:absolute;inset:0;border-radius:9px}
.fx>i::before{background:rgba(14,20,29,.82);animation:wv 7s ease-in-out infinite;animation-delay:var(--d)}
.fx>i::after{border:1px solid rgba(46,196,182,.7);opacity:0;animation:ed 7s ease-in-out infinite;animation-delay:var(--d)}
.fx svg{position:absolute;left:22%;top:22%;width:56%;height:56%;color:rgba(46,196,182,.8);opacity:0;animation:ic 7s ease-in-out infinite;animation-delay:var(--d)}
@keyframes wv{0%,100%{opacity:1}45%,55%{opacity:.06}}
@keyframes ed{0%,100%{opacity:0}45%,55%{opacity:1}}
@keyframes ic{0%,100%{opacity:0;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1) rotate(90deg)}}

.bd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.b{text-align:center;padding:10px 4px;border-radius:12px;background:rgba(255,255,255,.05);opacity:.45}

async function api(action,body){
  const r=await fetch("/api",{method:"POST",headers:{"Content-Type":"application/json",...(SES?{Authorization:"Bearer "+SES.token}:{})},body:JSON.stringify({action,...body})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){if(r.status===401&&SES&&action!=="login")logout();throw new Error(j.error||"Bağlantı hatası")}
  return j;
}
const CHK=["work","meals","checks","water","cf","hy","med","cal"];
let SYNC={core:null,months:{}};
function splitS(){
  const core={...S};CHK.forEach(k=>delete core[k]);
  const months={};
  CHK.forEach(k=>Object.keys(S[k]||{}).forEach(d=>{
    const v=S[k][d];if(Array.isArray(v)&&!v.length)return;
    const m=d.slice(0,7),o=months[m]=months[m]||{};(o[k]=o[k]||{})[d]=v;
  }));
  return{core,months};
}
function save(){
  if(!SES)return;
  localStorage.setItem("move-data-"+SES.email,JSON.stringify(S));

  clearTimeout(timer);timer=setTimeout(flush,500);
}
async function flush(){
  const {core,months}=splitS(),body={months:{}},cs=JSON.stringify(core),ms={};
  if(cs!==SYNC.core)body.core=core;
  Object.keys(months).forEach(m=>{ms[m]=JSON.stringify(months[m]);if(ms[m]!==SYNC.months[m])body.months[m]=months[m]});
  Object.keys(SYNC.months).forEach(m=>{if(!(m in ms))body.months[m]=null});
  if(!body.core&&!Object.keys(body.months).length){$("sync").textContent="";return}
  try{await api("savex",body);SYNC={core:cs,months:ms};$("sync").textContent="Kaydedildi"}
  catch(e){$("sync").textContent="Kaydedilemedi, internetini kontrol et"}
}

function pickEx(cb,only){
  const pk=$("pk"),src=EXLIB.filter(e=>!only||only(e)),gs=[...new Set(src.map(e=>e[1]))];let g="";
  pk.hidden=false;
  pk.innerHTML=`<div class="pkh"><input id="pkQ" placeholder="Hareket ara (örn. bench)"><button id="pkX">Kapat</button></div><div class="chips" id="pkG"><button data-g="" class="on">Hepsi</button>${gs.map(x=>`<button data-g="${esc(x)}">${esc(x)}</button>`).join("")}</div><div id="pkL" class="pkl"></div>`;
  const list=()=>{
    const q=$("pkQ").value.trim().toLowerCase(),L=src.filter(e=>(!g||e[1]===g)&&(!q||e[0].toLowerCase().includes(q))).slice(0,150);
    $("pkL").innerHTML=L.length?L.map(e=>`<button data-n="${esc(e[0])}"><span>${esc(e[0])}</span><small>${esc(e[1])}</small></button>`).join(""):`<div class="empty">Sonuç yok. Aradığın hareketi serbest yazabilirsin.</div>`;
    document.querySelectorAll("#pkL button").forEach(b=>b.onclick=()=>{pk.hidden=true;cb(b.dataset.n)});
  };
  $("pkQ").oninput=list;$("pkX").onclick=()=>{pk.hidden=true};
  document.querySelectorAll("#pkG button").forEach(b=>b.onclick=()=>{g=b.dataset.g;document.querySelectorAll("#pkG button").forEach(x=>x.classList.toggle("on",x===b));list()});
  list();
}

let WMODE="gym",WT=null;
const FD={amrap:{min:20},emom:{min:20,every:1},fortime:{cap:0},rft:{rounds:5,cap:0},ladder:{scheme:"21-15-9",cap:0},chipper:{cap:0},tabata:{rounds:8,work:20,rest:10},max:{min:5},deathby:{}};
let CF={fmt:"amrap",name:"",p:{...CFDEF,...FD.amrap},moves:[],res:"",note:""};
const segHTML=m=>`<div class="seg">${[["gym","Klasik"],["cf","CrossFit"],["hy","Hyrox"],["med","Meditasyon"],["cal","Calisthenics"]].map(([k,l])=>`<button data-m="${k}" class="${m===k?"on":""}">${l}</button>`).join("")}</div>`;
function bindSeg(){document.querySelectorAll("#t-work .seg button").forEach(b=>b.onclick=()=>{WMODE=b.dataset.m;renderWork()})}
const mmss=x=>{x=Math.max(0,Math.round(x));return Math.floor(x/60)+":"+String(x%60).padStart(2,"0")};
const fmtName=id=>(CFMT.find(f=>f.id===id)||{n:id}).n;
const pText=(f,p)=>({amrap:`${p.min} dk`,emom:`${p.min} dk, her ${p.every} dk`,fortime:p.cap?`sınır ${p.cap} dk`:"",rft:`${p.rounds} tur`+(p.cap?`, sınır ${p.cap} dk`:""),ladder:`${p.scheme}`+(p.cap?`, sınır ${p.cap} dk`:""),chipper:p.cap?`sınır ${p.cap} dk`:"",tabata:`${p.rounds}×(${p.work}/${p.rest} sn)`,max:p.min?`${p.min} dk`:"",deathby:""})[f]||"";
const mText=m=>m.map(x=>x.ex+(x.reps?" "+x.reps:"")+(x.load?" @"+x.load:"")).join(", ");
const cfShort=e=>"🏋 CrossFit "+esc(fmtName(e.fmt))+(e.name?" · "+esc(e.name):"")+" — "+esc(e.res||"sonuç yok");
function wodStart(mode,p){
  try{if(!TM.ac){const A=window.AudioContext||window.webkitAudioContext;TM.ac=new A()}if(TM.ac.resume)TM.ac.resume()}catch(e){}
  clearInterval(TM.iv);WT={mode,p,t0:Date.now(),last:-1};TM.iv=setInterval(wodTick,250);wodTick();
}
function wodTick(){
  if(!WT)return;
  const s=(Date.now()-WT.t0)/1000,p=WT.p,el=$("tm");el.hidden=false;
  let label="",pct=0,end=false,idx=0;
  if(WT.mode==="amrap"){const tot=p.min*60;label="AMRAP · "+mmss(tot-s);pct=s/tot;end=s>=tot}
  else if(WT.mode==="emom"){const tot=p.min*60,ev=Math.max(1,p.every)*60,n=Math.ceil(tot/ev);idx=Math.floor(s/ev);label=`EMOM ${Math.min(idx+1,n)}/${n} · ${mmss(ev-s%ev)}`;pct=s/tot;end=s>=tot}
  else if(WT.mode==="tabata"){const cyc=p.work+p.rest,tot=cyc*p.rounds,r=Math.floor(s/cyc),w=s%cyc<p.work;idx=r*2+(w?0:1);label=`TABATA ${Math.min(r+1,p.rounds)}/${p.rounds} · ${w?"ÇALIŞ":"DİNLEN"} ${Math.ceil(w?p.work-s%cyc:cyc-s%cyc)}`;pct=s/tot;end=s>=tot}
  else{label="FOR TIME · "+mmss(s);const cap=(p.cap||0)*60;pct=cap?s/cap:0;end=!!cap&&s>=cap}
  if(idx!==WT.last){if(WT.last>=0&&!end)beep();WT.last=idx}
  el.innerHTML=`<span><b>${label}</b></span><div class="bar"><i style="width:${Math.min(100,pct*100)}%"></i></div>${WT.mode==="fortime"?`<button id="tmF">Bitir</button>`:""}<button id="tmX">Durdur</button>`;
  $("tmX").onclick=tmStop;
  if($("tmF"))$("tmF").onclick=()=>{CF.res=mmss((Date.now()-WT.t0)/1000);tmStop();if(tab==="work"&&WMODE==="cf")renderCF()};
  if(end){clearInterval(TM.iv);beep();try{if(navigator.vibrate)navigator.vibrate([400,200,400])}catch(e){}setTimeout(tmStop,3000)}
}
function cfItem(e,i){
  return `<div class="item"><div class="n"><b>${esc(fmtName(e.fmt))}${e.name?" · "+esc(e.name):""}</b> — ${esc(e.res||"sonuç yok")}<small>${esc([pText(e.fmt,e.p||{}),mText(e.moves||[]),e.note].filter(Boolean).join(" · "))}</small></div><button class="cfd" data-i="${i}" aria-label="Sil" style="color:var(--bad);background:none;border:0">Sil</button></div>`;
}
function renderCF(){

  <div id="cfL">${CF.moves.map((m,i)=>`<div class="mv"><div class="n">${esc(m.ex)}</div><input data-i="${i}" data-k="reps" placeholder="${CF.fmt==="ladder"?"—":"Tekrar"}" value="${esc(m.reps)}"${CF.fmt==="ladder"?" disabled":""}><input data-i="${i}" data-k="load" placeholder="Yük" value="${esc(m.load)}"><button class="cfx" data-i="${i}" aria-label="Sil" style="color:var(--bad);background:none;border:0">✕</button></div>`).join("")||`<div class="empty">Hareket ekle ya da aşağıdan hazır WOD yükle.</div>`}</div>
  <div class="row"><button id="cfAdd">+ Listeden hareket</button><button id="cfFree">+ Serbest yaz</button></div>

  const d=$("date").value,logs=S.hy[d]||[],div=(S.profile&&S.profile.hxDiv)||"Open Erkek",R=HX.run;
  const races=Object.keys(S.hy).flatMap(x=>S.hy[x].filter(e=>e.k==="race"&&e.div===div).map(e=>({d:x,t:e.tot})));
  const best=races.length?races.reduce((a,b)=>b.t<a.t?b:a):null;
  let live="";
  if(R){
    const i=R.sp.length,t=HXS[i];
    live=`<div class="card"><b>Yarış devam ediyor · ${esc(R.div)}</b><div class="hxn" id="hxT">0:00:00</div><div style="text-align:center;color:var(--mut)">Bu bölüm: <b id="hxS" style="color:var(--tx)">0:00</b></div>
    <div style="text-align:center;margin:10px 0">${hxEnt(i)?`<div class="gxi big hxg" data-i="${i}"><img data-gp="${esc(hxEnt(i).ip[0])}" src="${esc(hxEnt(i).im[0])}" alt="${esc(t.n)}"></div>`:""}<small style="color:var(--mut)">Şimdi (${i+1}/16)</small><div class="hxn" style="font-size:28px">${t.n}</div><small>${esc(hxDesc(i,R.div))}</small>${i<15?`<small style="display:block;color:var(--mut);margin-top:4px">Sıradaki: ${HXS[i+1].n} · ${esc(hxDesc(i+1,R.div))}</small>`:""}</div>
    <button class="pri" id="hxNext" style="width:100%">${i<15?"Bitti, sıradaki bölüm →":"Yarışı bitir"}</button>
    <div class="row" style="margin-top:8px"><button id="hxUndo">Geri al</button><button id="hxCancel" style="color:var(--bad)">Vazgeç</button></div>
    ${R.sp.length?`<small style="color:var(--mut);display:block;margin-top:8px">${R.sp.map((v,j)=>HXS[j].n+" "+hms(v)).join(" · ")}</small>`:""}</div>`;
  }
  $("t-work").innerHTML=`${heroBox("run","Hyrox","8 koşu + 8 istasyon")}${segHTML("hy")}
  <div class="chips" id="hxDiv">${Object.keys(HXD).map(k=>`<button data-d="${k}" class="${k===div?"on":""}">${k}</button>`).join("")}</div>
  ${live||`<div class="card"><b>Yarış / simülasyon</b><small style="color:var(--mut);display:block;margin:4px 0 8px">Kronometreyi başlat, her bölümü bitirince sıradakine geç. Süreler otomatik kaydedilir.</small><button class="pri" id="hxGo" style="width:100%">⏱ Yarışı başlat</button>
  <details style="margin-top:8px"><summary>Süreleri elle gir (mm:ss)</summary><div class="grid" style="margin-top:8px">${HXS.map((t,i)=>`<label class="fld"><small>${t.n}</small><input data-h="${i}" placeholder="dk:sn" inputmode="numeric"></label>`).join("")}</div><label class="fld"><small>Toplam süre (boşsa bölümlerden hesaplanır, h:mm:ss)</small><input id="hxTot" placeholder="1:15:30"></label><div class="err" id="hxE"></div><button id="hxMan" style="width:100%;margin-top:8px">Kaydet</button></details></div>`}
  ${best?`<div class="card"><div class="macros"><span>${esc(div)} en iyi süren <b>${hms(best.t)}</b></span><span>${best.d}</span></div></div>`:""}
  <h2>${esc(div)} standartları</h2><div class="card">${HXS.map((t,i)=>{if(t.r)return"";const w=t.k?HXD[div][t.k]:"";return `<div class="item">${hxEnt(i)?`<div class="pxb hxg" data-i="${i}"><img data-gp="${esc(hxEnt(i).ip[0])}" src="${esc(hxEnt(i).im[0])}" alt=""></div>`:""}<div class="n">${t.n}<small>${t.d}${w?" · "+w:""}</small></div></div>`}).join("")}<small style="color:var(--mut)">Her istasyondan önce 1 km koşu var, toplam 8 koşu + 8 istasyon. Etkinliğe göre ağırlık ve ölçüler değişebilir, resmi kurallara bak.</small></div>
  <h2>Hazır antrenmanlar</h2><div class="card"><select id="hxT_" style="width:100%">${HXT.map((t,i)=>`<option value="${i}">${esc(t.n)}</option>`).join("")}</select><div id="hxTd" style="margin:8px 0;color:var(--mut)"></div><input id="hxRes" placeholder="Sonuç (örn. 58:40 ya da 5 tur tamam)" style="width:100%;margin-bottom:8px"><input id="hxNt" placeholder="Not (isteğe bağlı)" style="width:100%;margin-bottom:8px"><button class="pri" id="hxLogT" style="width:100%">Antrenmanı kaydet</button></div>
  <h2>Bugünkü Hyrox kayıtları</h2><div class="card">${logs.length?logs.map(hxLog).join(""):`<div class="empty">Bu gün için kayıt yok.</div>`}</div>`;
  bindSeg();
  if(!GX)gxLoad().then(()=>{if(HXF&&tab==="work"&&WMODE==="hy")renderHX()});
  document.querySelectorAll("#t-work .hxg").forEach(b=>b.onclick=()=>{const e=hxEnt(+b.dataset.i);if(e)gxShow(e,{noAdd:1})});
  document.querySelectorAll("#hxDiv button").forEach(b=>b.onclick=()=>{S.profile.hxDiv=b.dataset.d;save();renderHX()});
  const hd=()=>{const t=HXT[+$("hxT_").value];$("hxTd").textContent=t?t.d:""};$("hxT_").onchange=hd;hd();
  $("hxLogT").onclick=()=>{const t=HXT[+$("hxT_").value];if(!t)return;hxSave({k:"train",name:t.n,res:$("hxRes").value.trim(),note:$("hxNt").value.trim()});renderHX()};
  document.querySelectorAll("#t-work .hxd").forEach(b=>b.onclick=()=>{S.hy[d].splice(+b.dataset.i,1);save();renderHX()});
  if($("hxGo"))$("hxGo").onclick=()=>{const n=Date.now();HX.run={div,t0:n,t1:n,sp:[]};renderHX()};
  if($("hxMan"))$("hxMan").onclick=()=>{
    const sp=HXS.map((t,i)=>parseT(document.querySelector(`[data-h="${i}"]`).value)),tot=parseT($("hxTot").value)||sp.reduce((a,v)=>a+(v||0),0);
    if(!tot){$("hxE").style.color="var(--bad)";$("hxE").textContent="Toplam süre ya da bölüm süreleri gir";return}
    hxSave({k:"race",div,sp,tot});renderHX();
  };
  if(R){
    HX.iv=HX.iv||setInterval(hxTick,250);hxTick();
    $("hxNext").onclick=()=>{
      const n=Date.now();R.sp.push((n-R.t1)/1000);R.t1=n;
      if(R.sp.length>=16){hxSave({k:"race",div:R.div,sp:R.sp,tot:(n-R.t0)/1000});HX.run=null;clearInterval(HX.iv);HX.iv=null;try{beep()}catch(e){}}
      renderHX();
    };
    $("hxUndo").onclick=()=>{if(R.sp.length){const v=R.sp.pop();R.t1-=v*1000;renderHX()}};
    $("hxCancel").onclick=()=>{if(confirm("Yarış kaydı silinsin mi?")){HX.run=null;clearInterval(HX.iv);HX.iv=null;renderHX()}};
  }
}

const GAL0={"bench press":"Barbell Bench Press - Medium Grip","incline bench press":"Barbell Incline Bench Press - Medium Grip","decline bench press":"Decline Barbell Bench Press","dumbbell fly":"Dumbbell Flyes","cable fly":"Cable Crossover","pec deck":"Butterfly","push-up":"Pushups","dips":"Dips - Chest Version","machine chest press":"Leverage Chest Press","landmine press":"Landmine 180's","deadlift":"Barbell Deadlift","barbell row":"Bent Over Barbell Row","dumbbell row":"One-Arm Dumbbell Row","t-bar row":"Lying T-Bar Row","seated row":"Seated Cable Rows","lat pulldown":"Wide-Grip Lat Pulldown","pull-up":"Pullups","back extension":"Hyperextensions (Back Extensions)","shrug":"Barbell Shrug","rack pull":"Rack Pulls","overhead press":"Standing Military Press","arnold press":"Arnold Dumbbell Press","lateral raise":"Side Lateral Raise","front raise":"Front Dumbbell Raise","rear delt fly":"Reverse Flyes","upright row":"Upright Barbell Row","dumbbell curl":"Dumbbell Bicep Curl","biceps curl":"Dumbbell Bicep Curl","hammer curl":"Hammer Curls","cable curl":"Standing Biceps Cable Curl","concentration curl":"Concentration Curls","skull crusher":"EZ-Bar Skullcrusher","overhead triceps extension":"Standing Dumbbell Triceps Extension","close-grip bench press":"Close-Grip Barbell Bench Press","triceps kickback":"Tricep Dumbbell Kickback","back squat":"Barbell Full Squat","squat":"Barbell Full Squat","farmers carry":"Farmer's Walk","sled pull":"Sled Row","sandbag lunges":"Barbell Walking Lunge","wall balls":"Medicine Ball Scoop Throw","front squat":"Front Barbell Squat","lunge":"Barbell Lunge","bulgarian split squat":"Split Squat with Dumbbells","leg extension":"Leg Extensions","leg curl":"Seated Leg Curl","calf raise":"Standing Calf Raises","step-up":"Dumbbell Step Ups","hip thrust":"Barbell Hip Thrust","glute bridge":"Barbell Glute Bridge","cable kickback":"Glute Kickback","abductor machine":"Thigh Abductor","adductor machine":"Thigh Adductor","crunch":"Crunches","leg raise":"Flat Bench Lying Leg Raise","ab wheel rollout":"Ab Roller","bicycle crunch":"Air Bike","mountain climber":"Mountain Climbers","v-up":"Jackknife Sit-Up","air squat":"Bodyweight Squat","kettlebell swing":"One-Arm Kettlebell Swings","sinav":"Pushups","barfiks":"Pullups","mekik":"Crunches","side plank":"","wall sit":"","hollow hold":"","squat clean":"","hang power clean":"","hang power snatch":"","knees-to-elbows":"","kettlebell snatch":"One-Arm Kettlebell Snatch","kettlebell clean":"One-Arm Kettlebell Clean","slam ball":"One-Arm Medicine Ball Slam"};
const gxNorm=s=>String(s).toLowerCase().replace(/\u0307/g,"").replace(/ç/g,"c").replace(/ğ/g,"g").replace(/ı/g,"i").replace(/ö/g,"o").replace(/ş/g,"s").replace(/ü/g,"u").replace(/&/g," and ").replace(/[^a-z0-9]+/g," ").trim();
const gxSing=t=>t.length>3&&t.endsWith("s")&&!t.endsWith("ss")?t.slice(0,-1):t;
const gxToks=s=>gxNorm(s).split(" ").filter(Boolean).map(gxSing);
const GAL=Object.fromEntries(Object.entries(GAL0).map(([k,v])=>[gxNorm(k),v]));
function gxFind(name,exact){
  if(!GX||!GX.length||!name)return null;
  if(!GXI){GXI={by:{},T:[]};GX.forEach((e,i)=>{GXI.by[gxNorm(e.n)]=i;GXI.T.push(new Set(gxToks(e.n)))})}
  const n=gxNorm(name);
  if(n in GAL){const a=GAL[n];if(!a)return null;const k=GXI.by[gxNorm(a)];return k===undefined?null:GX[k]}
  if(GXI.by[n]!==undefined)return GX[GXI.by[n]];
  if(exact)return null;
  const q=gxToks(name);if(q.length<2)return null;
  let best=-1,bs=1e9;
  GXI.T.forEach((t,i)=>{if(q.every(x=>t.has(x))){const d=t.size-q.length;if(d<bs){bs=d;best=i}}});
  return best<0?null:GX[best];
}
const exBox=(ex,i)=>{const m=gxFind(ex);return m&&m.im[0]?`<div class="pxb wbx" data-i="${i}" title="Nasıl yapılır?"><img loading="lazy" data-gp="${esc(m.ip[0])}" src="${esc(m.im[0])}" alt="${esc(m.n)}"></div>`:`<a class="pxb wbx" data-i="${i}" target="_blank" rel="noopener" title="Video / YouTube" href="${esc(vidFor(ex,m&&m.n)||"https://www.youtube.com/results?search_query="+encodeURIComponent(ex+" nasıl yapılır"))}">▶</a>`};
let VID={};
async function loadVid(){try{VID=(await api("getvideos")).v||{}}catch(e){}}
const vidFor=(...n)=>{for(const x of n){if(!x)continue;const v=VID[gxNorm(x)];if(v&&/^https:\/\//.test(v.u))return v.u}return null};
const GCFV=n=>"https://www.youtube.com/results?search_query="+encodeURIComponent(n+" CrossFit movement standard");
function cfChips(mv){
  const seen=new Set();
  return `<span class="cfm">`+mv.filter(m=>m.ex&&!seen.has(m.ex.toLowerCase())&&seen.add(m.ex.toLowerCase())).map(m=>{
    const g=gxFind(m.ex,1);
    return g&&g.im[0]?`<span class="cfp cfx" data-n="${esc(m.ex)}"><img data-gp="${esc(g.ip[0])}" src="${esc(g.im[0])}" alt="">${esc(m.ex)}</span>`:`<a class="cfp" target="_blank" rel="noopener" title="Video / YouTube" href="${esc(vidFor(m.ex)||GCFV(m.ex))}"><i>▶</i>${esc(m.ex)}</a>`;
  }).join("")+`</span>`;
}
function gxDetailHTML(e,fav,o){
  o=o||{};
  return `<button id="gxB" style="margin-bottom:8px">‹ Geri</button>${e.im[0]?`<div class="gxi big"><img id="gxImg" data-gp="${esc(e.ip[0])}" src="${esc(e.im[0])}" alt="${esc(e.n)}"></div>`:""}<h2>${esc(e.n)}</h2>${o.sub?`<small style="color:var(--mut);display:block">${esc(o.sub)}</small>`:""}<small style="color:var(--mut)">${e.pm.length?"Ana kas: "+esc(e.pm.map(m=>GMT[m]||m).join(", "))+". ":""}${e.sm.length?"Yardımcı: "+esc(e.sm.map(m=>GMT[m]||m).join(", "))+". ":""}${e.eq?"Ekipman: "+esc(GEQ[e.eq]||e.eq)+".":""}</small>${e.ins.length?`<div class="card" style="margin-top:8px"><b>${e.en?"Yapılışı (İngilizce)":"Yapılışı"}</b><ol style="margin:6px 0 0;padding-left:18px">${e.ins.map(x=>`<li style="margin-bottom:4px">${esc(x)}</li>`).join("")}</ol></div>`:""}${vidFor(e.n,o.ex)?`<a class="gxy" style="border-color:var(--ac);color:var(--ac)" target="_blank" rel="noopener" href="${esc(vidFor(e.n,o.ex))}">🎬 Koçumun videosu</a>`:""}<a class="gxy" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(e.n+" nasıl yapılır")}">▶ YouTube'da nasıl yapılır</a><div class="row" style="margin-top:8px"><button id="gxFav">${fav.includes(e.n)?"★ Favoriden çıkar":"☆ Favoriye ekle"}</button>${o.noAdd?"":`<button class="pri" id="gxAdd">Antrenmana ekle</button>`}</div>${GCR}`;
}
function gxAnim(e){gxStop();if(e.ip.length>1){let k=0;GTMR=setInterval(()=>{const im=$("gxImg");if(!im){gxStop();return}k=(k+1)%e.ip.length;im.dataset.gp=e.ip[k];im.src=gxU(e.ip[k])},900)}}
function gxShow(e,o){
  const pk=$("pk");pk.hidden=false;const fav=()=>S.favx||(S.favx=[]);
  const draw=()=>{
    pk.innerHTML=`<div class="pkh"><b style="flex:1;align-self:center">Hareket</b><button id="gxX">Kapat</button></div><div id="gxL" class="pkl">${gxDetailHTML(e,fav(),o)}</div>`;
    gxAnim(e);$("gxX").onclick=gxClose;$("gxB").onclick=gxClose;
    $("gxFav").onclick=()=>{const f=fav(),x=f.indexOf(e.n);if(x>=0)f.splice(x,1);else f.push(e.n);save();draw()};
    const a=$("gxAdd");if(a)a.onclick=()=>{const d=$("date").value;(S.work[d]=S.work[d]||[]).push({ex:e.n,sets:3,reps:10,kg:lastKg(e.n)});save();gxClose();if(tab==="work"&&WMODE==="gym")renderWork();else{WMODE="gym";goTab("work")}};
  };
  draw();
}
const gxStop=()=>{if(GTMR){clearInterval(GTMR);GTMR=null}};
function gxClose(){gxStop();$("pk").hidden=true}
async function gxOpen(){
  const pk=$("pk");pk.hidden=false;
  let g="Hepsi",lim=40;
  pk.innerHTML=`<div class="pkh"><input id="gxQ" placeholder="Hareket veya kas ara (örn. curl, göğüs)"><button id="gxX">Kapat</button></div><div class="chips" id="gxG">${GCH.map(x=>`<button data-g="${x}" class="${x===g?"on":""}">${x==="Favoriler"?"★ Favoriler":x}</button>`).join("")}</div><div id="gxL" class="pkl"><div class="empty">Yükleniyor...</div></div>`;
  $("gxX").onclick=gxClose;
  const all=await gxLoad(),mapG=n=>n.startsWith("CrossFit")?"CrossFit":n;
  const base=all.length?all:EXLIB.filter(e=>!e[1].startsWith("CrossFit")).map(e=>({n:e[0],g:mapG(e[1]),pm:[],sm:[],eq:"",ins:[],im:[],ip:[]}));
  const cfi=EXLIB.filter(e=>e[1].startsWith("CrossFit")).map(e=>{const m=all.length?gxFind(e[0],1):null;return m?Object.assign(Object.create(m),{n:e[0],g:"CrossFit"}):{n:e[0],g:"CrossFit",pm:[],sm:[],eq:"",ins:[],im:[],ip:[]}});
  GI=base.concat(cfi);
  const note=all.length?"":`<div class="empty">Görsel veritabanına ulaşılamadı, hareketler görselsiz gösteriliyor. İnternet bağlantını kontrol edip tekrar aç.</div>`;
  const fav=()=>S.favx||(S.favx=[]);
  const list=()=>{
    const q=$("gxQ").value.trim().toLowerCase();
    const L=GI.map((e,i)=>({e,i})).filter(({e})=>(g==="Hepsi"||(g==="Favoriler"?fav().includes(e.n):e.g===g))&&(!q||(e.n+" "+e.pm.join(" ")+" "+e.pm.map(m=>GMT[m]||"").join(" ")+" "+e.g).toLowerCase().includes(q)));
    const sh=L.slice(0,lim);
    $("gxL").innerHTML=note+(sh.length?`<div class="gxg">${sh.map(({e,i})=>`<div class="gxc${e.im[0]?"":" gxn"}" data-i="${i}"><span class="gxs" data-f="${i}">${fav().includes(e.n)?"★":"☆"}</span>${e.im[0]?`<div class="gxi"><img loading="lazy" data-gp="${esc(e.ip[0])}" src="${esc(e.im[0])}" alt="${esc(e.n)}"></div>`:""}<b>${esc(e.n)}</b><small>${esc(e.g)}${e.pm[0]?" · "+esc(GMT[e.pm[0]]||e.pm[0]):""}</small></div>`).join("")}</div>${L.length>lim?`<button id="gxMore" style="width:100%;margin-top:8px">Daha fazla (${L.length-lim})</button>`:""}`:`<div class="empty">${g==="Favoriler"?"Henüz favorin yok. Kartlardaki ☆ işaretine bas.":"Sonuç yok."}</div>`);
  $("gxL").insertAdjacentHTML("beforeend",GCR);
  };
  const detail=i=>{
    const e=GI[i];gxStop();
    $("gxL").innerHTML=gxDetailHTML(e,fav());gxAnim(e);
    $("gxB").onclick=()=>{gxStop();list()};
    $("gxFav").onclick=()=>{const f=fav(),x=f.indexOf(e.n);if(x>=0)f.splice(x,1);else f.push(e.n);save();detail(i)};
    $("gxAdd").onclick=()=>{const d=$("date").value;(S.work[d]=S.work[d]||[]).push({ex:e.n,sets:3,reps:10,kg:lastKg(e.n)});save();gxClose();if(tab==="work"&&WMODE==="gym")renderWork();else{WMODE="gym";goTab("work")}};
  };
  $("gxQ").oninput=()=>{lim=40;list()};
  $("gxG").onclick=ev=>{const b=ev.target.closest("button");if(!b)return;g=b.dataset.g;lim=40;document.querySelectorAll("#gxG button").forEach(x=>x.classList.toggle("on",x===b));list()};
  $("gxL").onclick=ev=>{
    const s=ev.target.closest(".gxs");
    if(s){const e=GI[+s.dataset.f],f=fav(),x=f.indexOf(e.n);if(x>=0)f.splice(x,1);else f.push(e.n);save();s.textContent=x>=0?"☆":"★";return}
    if(ev.target.closest("#gxMore")){lim+=40;list();return}
    const c=ev.target.closest(".gxc");if(c)detail(+c.dataset.i);
  };
  list();
}

/* ---------- Rekor, geçmiş, zamanlayıcı ---------- */
function isPR(w,d){
  const k=w.ex.toLowerCase(),kg=+w.kg||0;if(kg<=0)return false;let mx=-1;
  Object.keys(S.work).forEach(x=>{if(x<d)S.work[x].forEach(e=>{if(e.ex.toLowerCase()===k)mx=Math.max(mx,+e.kg||0)})});
  return mx>0&&kg>mx;
}
function exNames(){const o={};Object.values(S.work).flat().forEach(e=>{const k=e.ex.toLowerCase();if(!o[k])o[k]=e.ex});return Object.values(o).sort()}
function exSeries(name){
  const k=name.toLowerCase(),out=[];
  Object.keys(S.work).sort().forEach(d=>{const L=S.work[d].filter(e=>e.ex.toLowerCase()===k);if(L.length)out.push({date:d,v:Math.max(0,...L.map(e=>+e.kg||0))})});
  return out;
}
function showEx(){
  const out=$("exOut");if(!out)return;
  const sr=exSeries($("exSel").value);if(!sr.length){out.innerHTML="";return}
  const v=sr.map(x=>x.v),best=Math.max(...v),last=v[v.length-1],fark=r1(last-v[0]);
  out.innerHTML=chartSvgS(sr)+`<div class="macros" style="margin-top:6px"><span>En yüksek <b>${best} kg</b></span><span>Son <b>${last} kg</b></span><span>Başlangıçtan <b>${fark>0?"+":""}${fark} kg</b></span><span><b>${sr.length}</b> antrenman</span></div>`;
}
let TM={end:0,tot:0,iv:null,ac:null};
function beep(){
  try{const c=TM.ac;[0,.25,.5].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.25;o.connect(g);g.connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+.15)})}catch(e){}
}
function tmStart(sec){
  try{if(!TM.ac){const A=window.AudioContext||window.webkitAudioContext;TM.ac=new A()}if(TM.ac.resume)TM.ac.resume()}catch(e){}
  WT=null;TM.tot=sec;TM.end=Date.now()+sec*1000;clearInterval(TM.iv);TM.iv=setInterval(tmTick,250);tmTick();
}
function tmStop(){clearInterval(TM.iv);TM.end=0;WT=null;$("tm").hidden=true}
function tmTick(){
  const left=Math.max(0,Math.ceil((TM.end-Date.now())/1000)),el=$("tm");el.hidden=false;
  el.innerHTML=`<span>⏱ <b>${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}</b></span><div class="bar"><i style="width:${(1-left/TM.tot)*100}%"></i></div><button id="tmX">Durdur</button>`;
  $("tmX").onclick=tmStop;
  if(left<=0){clearInterval(TM.iv);beep();try{if(navigator.vibrate)navigator.vibrate([300,150,300])}catch(e){}setTimeout(tmStop,2500)}
}

function bfNavy(c,boy,bel,boyun,kalca){
  boy=+boy;bel=+bel;boyun=+boyun;kalca=+kalca;if(!(boy&&bel&&boyun)||(c!=="E"&&c!=="K"))return null;

  else{if(!kalca||bel+kalca<=boyun)return null;v=495/(1.29579-0.35004*Math.log10(bel+kalca-boyun)+0.221*Math.log10(boy))-450}
  return v>=2&&v<=60?Math.round(v*10)/10:null;

  const altBox=x=>{const O=altOpts(x);return `<div class="altb card" style="margin:0 0 8px"><small style="color:var(--mut)">${esc(x.n)} yerine, benzer ${ALTG.find(g=>g[1].includes(x.n))?["kalori","protein","karbonhidrat","yağ"][ALTG.find(g=>g[1].includes(x.n))[0]]:"değer"} verecek öneriler:</small>${O.length?`<div class="chips">${O.map((o,k)=>`<button data-o="${k}">${o.g} g ${esc(o.n)} · ${o.r.kcal} kcal · P ${o.r.p}</button>`).join("")}</div>`:`<div class="empty">Bu yiyecek için hazır öneri yok, aşağıya kendin yazabilirsin.</div>`}<div class="row"><input class="altT" placeholder="Kendin yaz (örn. 2 dilim hindi füme)"><button class="altAdd">Ekle</button></div>${x.alt?`<button class="altDel" style="width:100%;margin-top:6px;color:var(--bad)">Alternatifleri sil</button>`:`<span class="altDel" hidden></span>`}</div>`};
  const dmDraw=()=>{

  $("dmCalc").onclick=()=>{const t=dmTot();$("dK").value=Math.round(t.kcal);$("dP").value=Math.round(t.p);$("dC").value=Math.round(t.c);$("dF").value=Math.round(t.f)};

  $("dS").onclick=async()=>{try{const x={kcal:$("dK").value,p:$("dP").value,c:$("dC").value,f:$("dF").value,water:$("dW").value,text:$("dT").value,meals:MEM.dm};await api("setdiet",{email:E,diet:x});MEM.pack.dt={kcal:+x.kcal||0,p:+x.p||0,c:+x.c||0,f:+x.f||0,water:Math.min(30,+x.water||0),text:x.text,meals:MEM.dm.map(m=>({name:m.name,items:m.items.map(i=>({...i}))}))};if(m.self)DIET=undefined;say("dE",1,"Beslenme programı kaydedildi")}catch(e){say("dE",0,e.message)}};

  $("ntS").onclick=async()=>{try{const t=$("ntT").value;await api("setnote",{email:E,text:t});MEM.pack.nt=t.trim()?{text:t.trim(),read:false}:null;say("ntE",1,t.trim()?"Not gönderildi":"Not silindi")}catch(e){say("ntE",0,e.message)}};

async function renderAcc(){
  $("t-acc").innerHTML=`<h1>Hesap</h1><div class="card"><div class="item"><div class="n">${esc(SES.email)}<small>${SES.admin?"Yönetici":"Kullanıcı"}</small></div></div><button id="out" style="width:100%">Çıkış yap</button></div>${SES.admin?`<h2>Şifre</h2><div class="card"><small style="color:var(--mut)">Yönetici şifren Vercel'deki ADMIN_PASSWORD ayarında durur. Değiştirmek için Vercel > Settings > Environment Variables bölümünden güncelle ve yeniden yayınla (Redeploy). Üyelerin şifresini Üyeler sekmesinden sıfırlayabilirsin.</small></div>`:`<h2>Şifre değiştir</h2><div class="card"><input id="pwC" type="password" autocomplete="current-password" placeholder="Mevcut şifre" style="width:100%;margin-bottom:8px"><input id="pwN" type="password" autocomplete="new-password" placeholder="Yeni şifre (en az 6 karakter)" style="width:100%;margin-bottom:8px"><input id="pwR" type="password" autocomplete="new-password" placeholder="Yeni şifre (tekrar)" style="width:100%"><div class="err" id="pwE"></div><button class="pri" id="pwS" style="width:100%">Şifreyi değiştir</button></div>`}<h2>Yedek</h2><div class="card"><button id="bkDl" style="width:100%;margin-bottom:8px">Verilerimi indir</button><button id="bkCsv" style="width:100%;margin-bottom:8px">📊 Raporumu indir (Excel)</button><label class="fld"><small>Yedekten geri yükle (.json)</small><input id="bkUp" type="file" accept=".json,application/json"></label><div class="err" id="bkE"></div></div>`+(SES.admin?`<div class="card"><b>Yeni kullanıcı ekle</b><div class="row" style="margin:8px 0"><input id="nNm" placeholder="Ad"><input id="nSn" placeholder="Soyad"></div><input id="nEm" type="email" placeholder="E-posta" style="width:100%;margin-bottom:8px"><input id="nPw" type="text" placeholder="Şifre (en az 6 karakter)" style="width:100%;margin-bottom:8px"><div class="err" id="nErr"></div><button class="pri" id="nAdd" style="width:100%">Kullanıcıyı ekle</button></div><div class="card"><b>Kullanıcılar</b><div id="ulist" class="empty">Yükleniyor...</div></div><h2>Hareket videoları</h2><div class="card"><small style="color:var(--mut)">Kendi çektiğin YouTube videosunun bağlantısını hareketin adıyla eşleştir. Üyeler hareketin detayında "Koçumun videosu" düğmesini görür.</small><input id="vN" list="vnl" placeholder="Hareket adı (örn. Squat)" style="width:100%;margin:8px 0"><datalist id="vnl">${EXLIB.map(e=>`<option value="${esc(e[0])}">`).join("")}</datalist><input id="vU" type="url" placeholder="YouTube bağlantısı (https://youtu.be/...)" style="width:100%;margin-bottom:8px"><div class="err" id="vE"></div><button class="pri" id="vAdd" style="width:100%">Videoyu kaydet</button><div id="vL" style="margin-top:8px"></div></div>`:"");
  $("out").onclick=logout;
  $("bkDl").onclick=()=>dl("move-yedek-"+isoD(new Date())+".json",{app:"move",v:1,exported:new Date().toISOString(),email:SES.email,data:S});
  $("bkCsv").onclick=()=>dlText("move-rapor-"+slug(SES.email.split("@")[0])+"-"+isoD(new Date())+".csv",csvReport(S,[(S.profile||{}).name,(S.profile||{}).surname].filter(Boolean).join(" ")||SES.email));
  $("bkUp").onchange=()=>{
    const f=$("bkUp").files[0];if(!f)return;const r=new FileReader(),e=$("bkE");
    r.onload=()=>{try{
      const o=JSON.parse(r.result);if(!o||!o.data||typeof o.data!=="object")throw 0;
      if(!confirm("Mevcut kayıtların bu yedekle değiştirilecek. Devam edilsin mi?"))return;
      S=Object.assign(EMPTY(),o.data);CHK.forEach(k=>{S[k]=S[k]||{}});fixS();save();e.style.color="var(--ac)";e.textContent="Yedek yüklendi"
    }catch(x){e.style.color="var(--bad)";e.textContent="Geçersiz yedek dosyası"}};
    r.readAsText(f);
  };
  if($("pwS"))$("pwS").onclick=async()=>{
    const e=$("pwE"),say=(ok,m)=>{e.style.color=ok?"var(--ac)":"var(--bad)";e.textContent=m};
    if($("pwN").value!==$("pwR").value)return say(0,"Yeni şifreler aynı değil");
    try{const j=await api("changepw",{current:$("pwC").value,password:$("pwN").value});SES.token=j.token;localStorage.setItem(TK,JSON.stringify(SES));$("pwC").value="";$("pwN").value="";$("pwR").value="";say(1,"Şifre değiştirildi. Diğer cihazlarda yeniden giriş yapman gerekir.")}
    catch(x){say(0,x.message)}
  };
  if(!SES.admin)return;
  const list=async()=>{try{const j=await api("users");$("ulist").innerHTML=j.users.length?j.users.map(u=>`<div class="item"><div class="n">${esc(u)}</div></div>`).join(""):"Henüz kullanıcı yok."}catch(e){$("ulist").textContent=e.message}};
  list();
  const vDraw=()=>{const ks=Object.keys(VID);$("vL").innerHTML=ks.length?ks.map(k=>`<div class="item"><div class="n">${esc(VID[k].n)}<small>${esc(VID[k].u)}</small></div><button class="x" data-k="${esc(k)}">Sil</button></div>`).join(""):`<div class="empty">Henüz video yok.</div>`;
    document.querySelectorAll("#vL .x").forEach(b=>b.onclick=async()=>{const o={...VID};delete o[b.dataset.k];await vSave(o)})};
  const vSave=async o=>{const e=$("vE");try{await api("setvideos",{v:o});VID=o;e.style.color="var(--ac)";e.textContent="Kaydedildi";vDraw()}catch(x){e.style.color="var(--bad)";e.textContent=x.message}};
  loadVid().then(vDraw);
  $("vAdd").onclick=async()=>{
    const n=$("vN").value.trim(),u=$("vU").value.trim();
    if(!n){$("vE").style.color="var(--bad)";$("vE").textContent="Hareket adı yaz";return}
    if(!/^https:\/\/(www\.|m\.)?(youtube\.com|youtu\.be)\//.test(u)){$("vE").style.color="var(--bad)";$("vE").textContent="Sadece https://youtube.com veya https://youtu.be bağlantısı";return}
    await vSave({...VID,[gxNorm(n)]:{n,u}});if($("vE").textContent==="Kaydedildi"){$("vN").value="";$("vU").value=""}
  };
  $("nAdd").onclick=async()=>{
    $("nErr").textContent="";
    try{await api("adduser",{name:$("nNm").value,surname:$("nSn").value,email:$("nEm").value,password:$("nPw").value});$("nNm").value="";$("nSn").value="";$("nEm").value="";$("nPw").value="";$("nErr").style.color="var(--ac)";$("nErr").textContent="Kullanıcı eklendi";list()}
    catch(e){$("nErr").style.color="var(--bad)";$("nErr").textContent=e.message}
  };
}

/* ---------- Giriş sahnesi (kare kare dalga) ---------- */
(function(){
  const I=[
   '<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="7"><circle cx="50" cy="50" r="42"/><circle cx="50" cy="50" r="27"/><circle cx="50" cy="50" r="8" fill="currentColor"/></svg>',
   '<svg viewBox="0 0 160 60" fill="currentColor"><rect x="4" y="8" width="16" height="44" rx="4"/><rect x="24" y="14" width="14" height="32" rx="4"/><rect x="38" y="26" width="84" height="8" rx="3"/><rect x="122" y="14" width="14" height="32" rx="4"/><rect x="140" y="8" width="16" height="44" rx="4"/></svg>',
   '<svg viewBox="0 0 100 110" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round"><path d="M32 40C28 8 72 8 68 40"/><circle cx="50" cy="72" r="30" fill="currentColor" stroke="none"/></svg>'
  ];
  function build(){
    const W=typeof innerWidth==="number"?innerWidth:390,H=typeof innerHeight==="number"?innerHeight:800,z=W>=900?100:62;
    const cols=Math.max(3,Math.round(W/z)),rows=Math.max(3,Math.round(H/z)),f=$("fx");
    f.style.gridTemplateColumns=`repeat(${cols},1fr)`;f.style.gridTemplateRows=`repeat(${rows},1fr)`;
    let h="";
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const n=r*cols+c;h+=`<i style="--d:${((c+r)*.2).toFixed(2)}s">${(n*7+r*3)%9===0?I[(n+r)%3]:""}</i>`}
    f.innerHTML=h;
  }
  build();
  if(typeof addEventListener==="function"){let t;addEventListener("resize",()=>{clearTimeout(t);t=setTimeout(build,300)})}
})();

$("lGo").onclick=async()=>{
  $("lErr").textContent="";
  try{
    const j=await api("login",{email:$("lEm").value,password:$("lPw").value});
    SES={token:j.token,email:j.email,admin:j.admin,name:j.name||"",surname:j.surname||""};tab="home";localStorage.setItem(TK,JSON.stringify(SES));
    $("lPw").value="";start();
  }catch(e){$("lErr").textContent=e.message}
};
async function start(){
  if(!SES){$("login").hidden=false;return}
  $("login").hidden=true;
  const c=localStorage.getItem("move-data-"+SES.email);
  S=c?JSON.parse(c):EMPTY();fixS();render();
  try{
    const j=await api("loadx"),mo=j.months||{};
    if(j.core||Object.keys(mo).length){
      S=Object.assign(EMPTY(),j.core||{});CHK.forEach(k=>{S[k]=Object.assign({},S[k]||{})});
      Object.keys(mo).sort().forEach(m=>CHK.forEach(k=>Object.assign(S[k],(mo[m]||{})[k]||{})));
      const legacy=!!j.core&&CHK.some(k=>j.core[k]&&Object.keys(j.core[k]).length);
      fixS();SYNC={core:legacy?null:JSON.stringify(splitS().core),months:{}};
      Object.keys(mo).forEach(m=>SYNC.months[m]=JSON.stringify(mo[m]));
      localStorage.setItem("move-data-"+SES.email,JSON.stringify(S));
      if(legacy)flush();
    }else{
      if(SES.admin&&localStorage.getItem(LEGACY))S=JSON.parse(localStorage.getItem(LEGACY));
      fixS();SYNC={core:null,months:{}};flush();
    }
    fixS();$("sync").textContent="";render();loadVid().then(()=>{if(tab==="work")render()});
  }catch(e){$("sync").textContent="Çevrimdışı, kayıtlar telefondan gösteriliyor"}
}
start();
