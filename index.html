<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Move</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b2433">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Move">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#1b2433;--card:#243044;--line:#34435c;--tx:#eaf0f7;--mut:#9fb0c8;--ac:#2ec4b6;--kc:#ffb703;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:0 0 10px}
h2{font-size:17px;margin:18px 0 8px}
.date{width:100%;margin-bottom:6px}
input,select,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac)}
.row{display:flex;gap:8px;margin-bottom:8px}
.row>*{flex:1}
button.pri{background:var(--ac);color:#06201d;font-weight:700;border:0}
button.x{flex:0 0 auto;padding:4px 10px;color:var(--bad);border-color:transparent;background:none}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px}
.item{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .n{flex:1}.item small{color:var(--mut);display:block}
.big{font-size:40px;font-weight:800;color:var(--kc);line-height:1}
.bar{height:8px;background:var(--bg);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--kc)}
.macros{display:flex;gap:14px;color:var(--mut)}.macros b{color:var(--tx)}
.prev{color:var(--kc);min-height:22px;margin-bottom:6px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:14px 0;color:var(--mut)}
nav button.on{color:var(--ac);font-weight:700}
.empty{color:var(--mut);padding:6px 0}
svg{width:100%;height:auto}
#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}#login .card{width:100%;max-width:360px}.err{color:var(--bad);min-height:20px;margin:6px 0}#sync{color:var(--mut);font-size:13px;min-height:18px}
details summary{cursor:pointer;color:var(--mut)}
</style>
</head>
<body>
<main>
<div id="login" hidden><div class="card"><h1>Move</h1><input id="lEm" type="email" autocomplete="username" placeholder="E-posta" style="width:100%;margin-bottom:8px"><input id="lPw" type="password" autocomplete="current-password" placeholder="Şifre" style="width:100%"><div class="err" id="lErr"></div><button class="pri" id="lGo" style="width:100%">Giriş yap</button></div></div>
<input type="date" id="date" class="date" aria-label="Tarih"><div id="sync"></div>
<section id="t-work"></section>
<section id="t-food" hidden></section>
<section id="t-prog" hidden></section>
<section id="t-acc" hidden></section>
</main>
<nav>
<button data-t="work" class="on">Antrenman</button>
<button data-t="food">Yemek</button>
<button data-t="prog">Gelişim</button>
<button data-t="acc">Hesap</button>
</nav>
<script>
// Besin değerleri: 100 gram için yaklaşık değerler [kcal, protein, karbonhidrat, yağ]
const FOODS={
"Yumurta (haşlanmış)":[143,12.6,0.7,9.5],"Tavuk göğsü (pişmiş)":[165,31,0,3.6],"Dana eti (pişmiş)":[250,26,0,15],
"Kıyma (pişmiş)":[250,25,0,16],"Somon":[208,20,0,13],"Ton balığı (suda)":[116,26,0,1],
"Pirinç pilavı (pişmiş)":[130,2.7,28,0.3],"Bulgur pilavı (pişmiş)":[83,3.1,18.6,0.2],"Makarna (pişmiş)":[158,5.8,31,0.9],
"Beyaz ekmek":[265,9,49,3.2],"Tam buğday ekmeği":[247,13,41,3.4],"Yulaf ezmesi (kuru)":[389,16.9,66,6.9],
"Süt (tam yağlı)":[61,3.2,4.8,3.3],"Yoğurt (tam yağlı)":[61,3.5,4.7,3.3],"Ayran":[38,1.7,2.9,1.9],
"Beyaz peynir":[264,14,4,21],"Lor peyniri":[98,11,3.4,4.3],
"Muz":[89,1.1,22.8,0.3],"Elma":[52,0.3,14,0.2],"Portakal":[47,0.9,11.8,0.1],
"Domates":[18,0.9,3.9,0.2],"Salatalık":[15,0.7,3.6,0.1],"Brokoli":[34,2.8,6.6,0.4],
"Patates (haşlanmış)":[87,1.9,20,0.1],"Tatlı patates":[86,1.6,20,0.1],
"Mercimek (pişmiş)":[116,9,20,0.4],"Nohut (pişmiş)":[164,8.9,27,2.6],"Kuru fasulye (pişmiş)":[127,8.7,22.8,0.5],
"Zeytinyağı":[884,0,0,100],"Zeytin":[115,0.8,6,11],"Avokado":[160,2,8.5,15],
"Fıstık ezmesi":[588,25,20,50],"Badem":[579,21,22,50],"Ceviz":[654,15,14,65],
"Bal":[304,0.3,82,0],"Sütlü çikolata":[535,7.7,59,30],"Whey protein":[400,80,8,6]
};
const LEGACY="spor-takip-v1",TK="move-session";
const EMPTY=()=>({work:{},meals:{},weights:[],custom:{},goal:2500});
let S=EMPTY(),SES=JSON.parse(localStorage.getItem(TK)||"null"),timer;
async function api(action,body){
  const r=await fetch("/api",{method:"POST",headers:{"Content-Type":"application/json",...(SES?{Authorization:"Bearer "+SES.token}:{})},body:JSON.stringify({action,...body})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){if(r.status===401&&SES&&action!=="login")logout();throw new Error((j.error||"Bağlantı hatası")+(j.debug?" ("+j.debug+")":""))}
  return j;
}
function save(){
  if(!SES)return;
  localStorage.setItem("move-data-"+SES.email,JSON.stringify(S));
  $("sync").textContent="Kaydediliyor...";
  clearTimeout(timer);
  timer=setTimeout(()=>api("save",{data:S}).then(()=>$("sync").textContent="Kaydedildi").catch(()=>$("sync").textContent="Kaydedilemedi, internetini kontrol et"),500);
}
function logout(){localStorage.removeItem(TK);SES=null;S=EMPTY();$("login").hidden=false}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r1=n=>Math.round(n*10)/10;
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const allFoods=()=>({...FOODS,...S.custom});
let tab="work";
$("date").value=today();
$("date").onchange=render;
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));render()});

function render(){
  ["work","food","prog","acc"].forEach(t=>$("t-"+t).hidden=t!==tab);
  ({work:renderWork,food:renderFood,prog:renderProg,acc:renderAcc})[tab]();
}

/* ---------- Antrenman ---------- */
function renderWork(){
  const d=$("date").value,list=S.work[d]||[];
  $("t-work").innerHTML=`<h1>Antrenman</h1>
  <div class="card">
    <input id="wEx" placeholder="Hareket (örn. Bench press)" list="exs" style="width:100%;margin-bottom:8px">
    <datalist id="exs">${[...new Set(Object.values(S.work).flat().map(w=>w.ex))].map(e=>`<option value="${esc(e)}">`).join("")}</datalist>
    <div class="row"><input id="wSet" type="number" inputmode="numeric" placeholder="Set"><input id="wRep" type="number" inputmode="numeric" placeholder="Tekrar"><input id="wKg" type="number" inputmode="decimal" placeholder="Kg"></div>
    <button class="pri" id="wAdd" style="width:100%">Hareketi ekle</button>
  </div>
  <div class="card">${list.length?list.map((w,i)=>`<div class="item"><div class="n">${esc(w.ex)}<small>${w.sets} set × ${w.reps} tekrar · ${w.kg} kg · hacim ${w.sets*w.reps*w.kg} kg</small></div><button class="x" data-i="${i}" aria-label="Sil">Sil</button></div>`).join(""):`<div class="empty">Bu gün için hareket yok. Yukarıdan ilk hareketi ekle.</div>`}</div>`;
  $("wAdd").onclick=()=>{
    const ex=$("wEx").value.trim(),sets=+$("wSet").value,reps=+$("wRep").value,kg=+$("wKg").value||0;
    if(!ex||!sets||!reps)return alert("Hareket adı, set ve tekrar gerekli.");
    (S.work[d]=S.work[d]||[]).push({ex,sets,reps,kg});save();renderWork();
  };
  document.querySelectorAll("#t-work .x").forEach(b=>b.onclick=()=>{S.work[d].splice(+b.dataset.i,1);save();renderWork()});
}

/* ---------- Yemek ---------- */
function calc(name,g){const f=allFoods()[name];if(!f)return null;const k=g/100;return{kcal:Math.round(f[0]*k),p:r1(f[1]*k),c:r1(f[2]*k),f:r1(f[3]*k)}}
function renderFood(){
  const d=$("date").value,list=S.meals[d]||[];
  const T=list.reduce((a,m)=>({kcal:a.kcal+m.kcal,p:a.p+m.p,c:a.c+m.c,f:a.f+m.f}),{kcal:0,p:0,c:0,f:0});
  const pct=Math.min(100,T.kcal/S.goal*100);
  const meals=["Kahvaltı","Öğle","Akşam","Ara öğün"];
  $("t-food").innerHTML=`<h1>Yemek</h1>
  <div class="card"><div class="big">${T.kcal}<small style="font-size:16px;color:var(--mut);font-weight:400"> / ${S.goal} kcal</small></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="macros"><span>Protein <b>${r1(T.p)} g</b></span><span>Karb. <b>${r1(T.c)} g</b></span><span>Yağ <b>${r1(T.f)} g</b></span></div>
    <div class="row" style="margin:10px 0 0"><input id="goal" type="number" inputmode="numeric" value="${S.goal}" aria-label="Günlük kalori hedefi"><button id="goalSave">Hedefi kaydet</button></div></div>
  <div class="card">
    <input id="fName" list="fl" placeholder="Yiyecek ara (örn. Tavuk göğsü)" style="width:100%;margin-bottom:8px">
    <datalist id="fl">${Object.keys(allFoods()).sort().map(n=>`<option value="${esc(n)}">`).join("")}</datalist>
    <div class="row"><input id="fG" type="number" inputmode="decimal" placeholder="Gram"><select id="fM">${meals.map(m=>`<option>${m}</option>`).join("")}</select></div>
    <div class="prev" id="prev"></div>
    <button class="pri" id="fAdd" style="width:100%">Yemeği ekle</button>
  </div>
  <div class="card">${list.length?list.map((m,i)=>`<div class="item"><div class="n">${esc(m.name)} · ${m.g} g<small>${esc(m.meal)} · P ${m.p} · K ${m.c} · Y ${m.f}</small></div><b>${m.kcal} kcal</b><button class="x" data-i="${i}" aria-label="Sil">Sil</button></div>`).join(""):`<div class="empty">Bu gün için yemek yok.</div>`}</div>
  <details class="card"><summary>Listede olmayan yiyecek ekle (100 g değerleri)</summary>
    <input id="cN" placeholder="Yiyecek adı" style="width:100%;margin:8px 0">
    <div class="row"><input id="cK" type="number" inputmode="decimal" placeholder="Kcal"><input id="cP" type="number" inputmode="decimal" placeholder="Protein"></div>
    <div class="row"><input id="cC" type="number" inputmode="decimal" placeholder="Karb."><input id="cF" type="number" inputmode="decimal" placeholder="Yağ"></div>
    <button id="cAdd" style="width:100%">Yiyeceği kaydet</button></details>`;
  const upd=()=>{const r=calc($("fName").value,+$("fG").value);$("prev").textContent=r?`${r.kcal} kcal · P ${r.p} · K ${r.c} · Y ${r.f}`:""};
  $("fName").oninput=upd;$("fG").oninput=upd;
  $("goalSave").onclick=()=>{S.goal=+$("goal").value||2500;save();renderFood()};
  $("fAdd").onclick=()=>{
    const name=$("fName").value,g=+$("fG").value,r=calc(name,g);
    if(!r)return alert("Bu yiyecek listede yok. Aşağıdan kendi yiyeceğini ekleyebilirsin.");
    if(!g)return alert("Gram gir.");
    (S.meals[d]=S.meals[d]||[]).push({name,g,meal:$("fM").value,...r});save();renderFood();
  };
  $("cAdd").onclick=()=>{
    const n=$("cN").value.trim();if(!n||!$("cK").value)return alert("Ad ve kcal gerekli.");
    S.custom[n]=[+$("cK").value,+$("cP").value||0,+$("cC").value||0,+$("cF").value||0];save();renderFood();
  };
  document.querySelectorAll("#t-food .x").forEach(b=>b.onclick=()=>{S.meals[d].splice(+b.dataset.i,1);save();renderFood()});
}

/* ---------- Gelişim ---------- */
function renderProg(){
  const w=[...S.weights].sort((a,b)=>a.date.localeCompare(b.date));
  let chart=`<div class="empty">Grafik için en az 2 kilo kaydı gir.</div>`;
  if(w.length>1){
    const v=w.map(x=>x.kg),mn=Math.min(...v)-1,mx=Math.max(...v)+1,W=320,H=140;
    const pts=w.map((x,i)=>[10+i*(W-20)/(w.length-1),H-10-(x.kg-mn)/(mx-mn)*(H-20)]);
    chart=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kilo grafiği"><polyline fill="none" stroke="#2ec4b6" stroke-width="3" points="${pts.map(p=>p.join(",")).join(" ")}"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#2ec4b6"/>`).join("")}</svg><div class="macros"><span>İlk <b>${v[0]} kg</b></span><span>Son <b>${v[v.length-1]} kg</b></span><span>Fark <b>${r1(v[v.length-1]-v[0])} kg</b></span></div>`;
  }
  const days=[];for(let i=6;i>=0;i--){const t=new Date($("date").value);t.setDate(t.getDate()-i);days.push(new Date(t-t.getTimezoneOffset()*6e4).toISOString().slice(0,10))}
  const kc=days.map(x=>(S.meals[x]||[]).reduce((a,m)=>a+m.kcal,0)),ws=days.filter(x=>(S.work[x]||[]).length).length;
  $("t-prog").innerHTML=`<h1>Gelişim</h1>
  <div class="card"><div class="row"><input id="gKg" type="number" inputmode="decimal" placeholder="Bugünkü kilo (kg)"><button class="pri" id="gAdd">Kaydet</button></div>${chart}</div>
  <div class="card"><b>Son 7 gün</b><div class="macros" style="margin-top:6px"><span>Antrenman <b>${ws} gün</b></span><span>Ort. kalori <b>${Math.round(kc.reduce((a,b)=>a+b,0)/7)}</b></span></div></div>
  <div class="card">${w.slice().reverse().slice(0,8).map(x=>`<div class="item"><div class="n">${x.date}</div><b>${x.kg} kg</b></div>`).join("")||`<div class="empty">Henüz kilo kaydı yok.</div>`}</div>`;
  $("gAdd").onclick=()=>{
    const kg=+$("gKg").value;if(!kg)return;const d=$("date").value;
    S.weights=S.weights.filter(x=>x.date!==d);S.weights.push({date:d,kg});save();renderProg();
  };
}
/* ---------- Hesap ---------- */
async function renderAcc(){
  $("t-acc").innerHTML=`<h1>Hesap</h1><div class="card"><div class="item"><div class="n">${esc(SES.email)}<small>${SES.admin?"Yönetici":"Kullanıcı"}</small></div></div><button id="out" style="width:100%">Çıkış yap</button></div>`+(SES.admin?`<div class="card"><b>Yeni kullanıcı ekle</b><input id="nEm" type="email" placeholder="E-posta" style="width:100%;margin:8px 0"><input id="nPw" type="text" placeholder="Şifre (en az 6 karakter)" style="width:100%;margin-bottom:8px"><div class="err" id="nErr"></div><button class="pri" id="nAdd" style="width:100%">Kullanıcıyı ekle</button></div><div class="card"><b>Kullanıcılar</b><div id="ulist" class="empty">Yükleniyor...</div></div>`:"");
  $("out").onclick=logout;
  if(!SES.admin)return;
  const list=async()=>{try{const j=await api("users");$("ulist").innerHTML=j.users.length?j.users.map(u=>`<div class="item"><div class="n">${esc(u)}</div></div>`).join(""):"Henüz kullanıcı yok."}catch(e){$("ulist").textContent=e.message}};
  list();
  $("nAdd").onclick=async()=>{
    $("nErr").textContent="";
    try{await api("adduser",{email:$("nEm").value,password:$("nPw").value});$("nEm").value="";$("nPw").value="";$("nErr").style.color="var(--ac)";$("nErr").textContent="Kullanıcı eklendi";list()}
    catch(e){$("nErr").style.color="var(--bad)";$("nErr").textContent=e.message}
  };
}

/* ---------- Giriş ---------- */
$("lGo").onclick=async()=>{
  $("lErr").textContent="";
  try{
    const j=await api("login",{email:$("lEm").value,password:$("lPw").value});
    SES={token:j.token,email:j.email,admin:j.admin};localStorage.setItem(TK,JSON.stringify(SES));
    $("lPw").value="";start();
  }catch(e){$("lErr").textContent=e.message}
};
async function start(){
  if(!SES){$("login").hidden=false;return}
  $("login").hidden=true;
  const c=localStorage.getItem("move-data-"+SES.email);
  S=c?JSON.parse(c):EMPTY();render();
  try{
    const j=await api("load");
    if(j.data){S=j.data;localStorage.setItem("move-data-"+SES.email,JSON.stringify(S))}
    else if(SES.admin&&localStorage.getItem(LEGACY)){S=JSON.parse(localStorage.getItem(LEGACY));save()}
    else save();
    $("sync").textContent="";render();
  }catch(e){$("sync").textContent="Çevrimdışı, kayıtlar telefondan gösteriliyor"}
}
start();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
