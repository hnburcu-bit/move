:root{--bg:#1b2433;--card:#243044;--line:#34435c;--tx:#eaf0f7;--mut:#9fb0c8;--ac:#2ec4b6;--kc:#ffb703;--bad:#ff6b6b}
*{box-sizing:border-box}
[hidden]{display:none!important}
#bg{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;background-repeat:no-repeat;transition:background-image .3s}
body{margin:0;background:#0e141d;color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 calc(72px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:26px;margin:0 0 10px}
h2{font-size:15px;margin:20px 0 8px;color:var(--ac)}
h1,h2,.big,.m b,nav button,button.pri,.hero h1,.chips button{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.05em}
h1,.hero h1{font-weight:800}h2{font-weight:700;letter-spacing:.12em}nav button{font-size:13px;font-weight:700;letter-spacing:.03em}
textarea{width:100%;resize:vertical}
.date{width:100%;margin-bottom:6px}
input,select,button,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac)}
.row{display:flex;gap:8px;margin-bottom:8px}
.row>*{flex:1}
button.pri{background:var(--ac);color:#06201d;font-weight:700;border:0}
button.x{flex:0 0 auto;padding:4px 10px;color:var(--bad);border-color:transparent;background:none}
.card{background:rgba(36,48,68,.58);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:14px;padding:12px;margin-bottom:10px}
.item{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .n{flex:1}.item small{color:var(--mut);display:block}
.big{font-size:40px;font-weight:800;color:var(--kc);line-height:1}
.bar{height:8px;background:var(--bg);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--kc)}
.macros{display:flex;gap:14px;color:var(--mut)}.macros b{color:var(--tx)}
.prev{color:var(--kc);min-height:22px;margin-bottom:6px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(36,48,68,.94);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:14px 0;color:var(--mut)}
nav button.on{color:var(--ac);font-weight:700}
.empty{color:var(--mut);padding:6px 0}
svg{width:100%;height:auto}
#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}#login .card{width:100%;max-width:360px}.err{color:var(--bad);min-height:20px;margin:6px 0}#sync{color:var(--mut);font-size:13px;min-height:18px}
[hidden]{display:none!important}
.hero{position:relative;overflow:hidden;border-radius:16px;padding:18px;margin-bottom:12px;min-height:118px;background:linear-gradient(135deg,#1d6a73,#243044 75%)}
.hero svg{position:absolute;right:-4px;bottom:-6px;height:125%;color:rgba(255,255,255,.2)}
.hero>div{position:relative}.hero small{color:#cfe3ee}.hero h1{margin:2px 0 0;font-size:38px;line-height:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.m{background:rgba(36,48,68,.58);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:12px;padding:10px}.m b{font-size:24px}.m small{color:var(--mut);display:block}
.m small.up{color:var(--kc)}.m small.dn{color:var(--ac)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chips button{padding:6px 12px;border-radius:20px;color:var(--mut)}
.chips button.on{background:var(--ac);color:#06201d;border:0;font-weight:700}
.fld{display:block}.fld small{display:block;color:var(--mut)}.fld input{width:100%}
#lb{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
#lb img{max-width:94%;max-height:74%;border-radius:12px}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.pg div{aspect-ratio:3/4;background:var(--bg) center/cover;border-radius:10px;position:relative}
.pg small{position:absolute;left:6px;bottom:4px;text-shadow:0 1px 3px #000}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.cmp img{width:100%;border-radius:10px}.cmp small{color:var(--mut)}
.ck{min-width:112px}.ck.ok{background:var(--ac);color:#06201d;border:0;font-weight:700}.ck.no{background:var(--bad);color:#fff;border:0;font-weight:700}
.week{display:flex;gap:6px;margin:8px 0}.dy{flex:1;text-align:center;border-radius:10px;padding:6px 0;background:rgba(255,255,255,.07)}.dy small{display:block;font-size:11px;color:inherit;opacity:.8}.dy b{font-size:18px}
.dy.ok{background:var(--ac);color:#06201d}.dy.no{background:var(--bad);color:#fff}
#login{background:linear-gradient(rgba(14,20,29,.55),rgba(14,20,29,.78)),url(bg6.jpg) center/cover no-repeat,url(bg3.jpg) center/cover no-repeat;overflow:hidden}
@media (min-width:900px) and (min-aspect-ratio:1/1){#login{background-image:linear-gradient(rgba(14,20,29,.55),rgba(14,20,29,.78)),url(bg6w.jpg),url(bg3w.jpg)}}
#login .card{position:relative;z-index:1}
.fx{position:absolute;inset:0;display:grid;gap:5px;padding:5px;pointer-events:none}
.fx>i{position:relative;display:block}
.fx>i::before,.fx>i::after{content:"";position:absolute;inset:0;border-radius:9px}
.fx>i::before{background:rgba(14,20,29,.82);animation:wv 7s ease-in-out infinite;animation-delay:var(--d)}
.fx>i::after{border:1px solid rgba(46,196,182,.7);opacity:0;animation:ed 7s ease-in-out infinite;animation-delay:var(--d)}
.fx svg{position:absolute;left:22%;top:22%;width:56%;height:56%;color:rgba(46,196,182,.8);opacity:0;animation:ic 7s ease-in-out infinite;animation-delay:var(--d)}
@keyframes wv{0%,100%{opacity:1}45%,55%{opacity:.06}}
@keyframes ed{0%,100%{opacity:0}45%,55%{opacity:1}}
@keyframes ic{0%,100%{opacity:0;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1) rotate(90deg)}}
@media (prefers-reduced-motion:reduce){.fx>i::before,.fx>i::after,.fx svg{animation:none}.fx>i::before{opacity:.9}}
.bd{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.b{text-align:center;padding:10px 4px;border-radius:12px;background:rgba(255,255,255,.05);opacity:.45}
.b.on{opacity:1;background:rgba(46,196,182,.16);border:1px solid rgba(46,196,182,.5)}
.b i{display:block;font-style:normal;font-size:28px;filter:grayscale(1)}.b.on i{filter:none}
.b b{display:block;font-size:13px;line-height:1.15}.b small{color:var(--mut);font-size:11px}
#mBack{margin-bottom:10px}

#tm .bar{flex:1;margin:0}#tm b{font-size:22px}
.wb{min-width:44px;font-size:18px}
.chips.fav button{text-transform:none;font-family:inherit;letter-spacing:0}
#pk{position:fixed;inset:0;z-index:70;background:rgba(14,20,29,.98);display:flex;flex-direction:column;gap:10px;padding:12px;width:min(100%,560px);left:50%;transform:translateX(-50%)}
.pkh{display:flex;gap:8px}.pkh input{flex:1}
#pkG{flex-wrap:nowrap;overflow-x:auto;margin:0;flex:0 0 auto}#pkG button{white-space:nowrap}
.gxg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gxc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:4px}
.gxi{aspect-ratio:4/3;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:34px}
.gxi.big{aspect-ratio:4/3;max-height:50vh;width:100%}
.gxi img{width:100%;height:100%;object-fit:contain}
.gxc b{font-size:13px;text-transform:none;font-family:inherit;letter-spacing:0;line-height:1.2}.gxc small{color:var(--mut)}
.gxs{position:absolute;top:12px;right:12px;z-index:2;background:rgba(0,0,0,.6);color:#ffd166;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:17px}
.gxy{display:block;margin-top:10px;padding:11px;text-align:center;border:1px solid var(--line);border-radius:10px;color:var(--tx);text-decoration:none}
.pkl{flex:1;overflow-y:auto}.pkl button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;margin-bottom:6px;text-transform:none;font-family:inherit}.pkl small{color:var(--mut)}
.seg{display:flex;gap:8px;margin:8px 0}.seg button{flex:1}.seg button.on{background:var(--ac);color:#06201d;border:0;font-weight:700}
.mv{display:grid;grid-template-columns:1fr 70px 90px auto;gap:6px;align-items:center;margin-bottom:6px}.mv input{padding:8px;width:100%}
.tb{display:grid;grid-template-columns:1fr 56px 56px auto;gap:6px;align-items:center;margin-bottom:6px}.tb input{padding:8px;width:100%}
details summary{cursor:pointer;color:var(--mut)}
</style>

let PROG=null;
function parseCF(l){
  const a=l.replace(/^CF:\s*/i,"").split("|").map(x=>x.trim());
  const fmt=CFMT.find(f=>f.id===a[1])?a[1]:"amrap",p={...CFDEF,...FD[fmt]};
  (a[2]||"").split(",").forEach(kv=>{const q=kv.split("="),k=(q[0]||"").trim();if(k&&q[1]!==undefined&&k in CFDEF)p[k]=k==="scheme"?q[1].trim():(+q[1]||0)});
  const moves=(a[3]||"").split(";").map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.match(/^(?:(.+?)\s+[×x]\s+)?(.+?)(?:\s*@\s*(.+))?$/);return{ex:m[2],reps:(m[1]||"").trim(),load:(m[3]||"").trim()}});
  return{name:a[0]||"WOD",fmt,p,moves,note:a[4]||""};
}
function cfLine(name,fmt,p,moves,note){
  const keys=(CFMT.find(f=>f.id===fmt)||{p:[]}).p.map(x=>x[0]);
  const cl=x=>String(x==null?"":x).replace(/[|;\n]/g," ").trim();
  return "CF: "+[cl(name),fmt,keys.map(k=>k+"="+cl(p[k])).join(","),moves.map(m=>(m.reps?cl(m.reps)+" × ":"")+cl(m.ex)+(m.load?" @"+cl(m.load):"")).join("; "),cl(note)].join(" | ");
}
function parseProg(t){
  const days=[];let cur=null;
  (t||"").split(/\r?\n/).map(x=>x.trim()).filter(Boolean).forEach(l=>{
    if(l[0]==="#"){cur={name:l.replace(/^#+\s*/,"")||"Gün",items:[]};days.push(cur);return}
    if(!cur){cur={name:"Program",items:[]};days.push(cur)}
    if(/^CF:/i.test(l)){cur.items.push({cf:parseCF(l)});return}
    const m=l.match(/^(.+?)\s+(\d+)\s*[xX×]\s*(\d+)\s*$/);
    cur.items.push(m?{ex:m[1],sets:+m[2],reps:+m[3]}:{ex:l,sets:3,reps:10});
  });
  return days;
}

/* ---------- Rekor, geçmiş, zamanlayıcı ---------- */
function isPR(w,d){
  const k=w.ex.toLowerCase(),kg=+w.kg||0;if(kg<=0)return false;let mx=-1;
  Object.keys(S.work).forEach(x=>{if(x<d)S.work[x].forEach(e=>{if(e.ex.toLowerCase()===k)mx=Math.max(mx,+e.kg||0)})});
  return mx>0&&kg>mx;
}
function exNames(){const o={};Object.values(S.work).flat().forEach(e=>{const k=e.ex.toLowerCase();if(!o[k])o[k]=e.ex});return Object.values(o).sort()}
function exSeries(name){
  const k=name.toLowerCase(),out=[];
  Object.keys(S.work).sort().forEach(d=>{const L=S.work[d].filter(e=>e.ex.toLowerCase()===k);if(L.length)out.push({date:d,v:Math.max(0,...L.map(e=>+e.kg||0))})});
  return out;
}
function showEx(){
  const out=$("exOut");if(!out)return;

  const v=sr.map(x=>x.v),best=Math.max(...v),last=v[v.length-1],fark=r1(last-v[0]);

let TM={end:0,tot:0,iv:null,ac:null};
function beep(){

}
function tmStart(sec){
  try{if(!TM.ac){const A=window.AudioContext||window.webkitAudioContext;TM.ac=new A()}if(TM.ac.resume)TM.ac.resume()}catch(e){}

}
function tmStop(){clearInterval(TM.iv);TM.end=0;WT=null;$("tm").hidden=true}
function tmTick(){
  const left=Math.max(0,Math.ceil((TM.end-Date.now())/1000)),el=$("tm");el.hidden=false;
  el.innerHTML=`<span>⏱ <b>${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}</b></span><div class="bar"><i style="width:${(1-left/TM.tot)*100}%"></i></div><button id="tmX">Durdur</button>`;

}

/* ---------- Rozetler ---------- */
const isoD=x=>new Date(x-x.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const BADGES=[
 ["🏁","İlk adım","İlk antrenmanını kaydet",s=>s.wd,1],
 ["💪","10 antrenman","10 antrenman günü",s=>s.wd,10],
 ["🏆","50 antrenman","50 antrenman günü",s=>s.wd,50],
 ["🔥","7 gün seri","Üst üste 7 gün antrenman",s=>s.best,7],
 ["⚡","30 gün seri","Üst üste 30 gün antrenman",s=>s.best,30],
 ["🥗","3 disiplinli gün","3 gün tüm öğünleri yedim",s=>s.disc,3],
 ["🥇","10 disiplinli gün","10 gün tüm öğünler",s=>s.disc,10],
 ["📏","İlk ölçüm","İlk ölçümünü gir",s=>s.meas,1],
 ["📈","5 ölçüm","5 ölçüm kaydı",s=>s.meas,5],
 ["🚀","İlk rekor","Bir harekette rekor kır",s=>s.pr,1],
 ["💥","10 rekor","10 rekor kır",s=>s.pr,10],
 ["🤸","İlk WOD","İlk CrossFit WOD'unu kaydet",s=>s.cf,1],
 ["🏅","10 WOD","10 CrossFit WOD kaydet",s=>s.cf,10],
 ["🙋","Profil tamam","Ad, soyad ve boyunu gir",s=>s.prof,1]
];
function stats(D){
  const ck=D.checks||{},wk=D.work||{},days=new Set();
  Object.keys(wk).forEach(d=>{if((wk[d]||[]).length)days.add(d)});
  const cfd=D.cf||{};let cfn=0;Object.keys(cfd).forEach(d=>{const n=(cfd[d]||[]).length;if(n){days.add(d);cfn+=n}});
  Object.keys(ck).forEach(d=>{if(ck[d].w===true)days.add(d);else if(ck[d].w===false)days.delete(d)});
  let best=0,run=0,prev=null;
  [...days].sort().forEach(d=>{run=prev&&(new Date(d)-new Date(prev))===864e5?run+1:1;best=Math.max(best,run);prev=d});
  let cur=0;const c=new Date();if(!days.has(isoD(c)))c.setDate(c.getDate()-1);
  while(days.has(isoD(c))){cur++;c.setDate(c.getDate()-1)}
  let disc=0;Object.values(ck).forEach(x=>{const m=x.m||{};if(MEALS.every(k=>m[k]===true))disc++});
  const mx={};let pr=0;
  Object.keys(wk).sort().forEach(d=>(wk[d]||[]).forEach(e=>{const k=String(e.ex).toLowerCase(),kg=+e.kg||0;if(kg>0){if(mx[k]!==undefined&&kg>mx[k])pr++;mx[k]=Math.max(mx[k]||0,kg)}}));
  const P=D.profile||{};
  return{wd:days.size,cf:cfn,best,cur,disc,pr,meas:(D.meas||[]).length,prof:(P.name&&P.surname&&P.boy)?1:0};
}
function badgeCard(D){
  const s=stats(D),L=BADGES.map(([ic,n,ds,f,g])=>({ic,n,ds,v:f(s),g})),got=L.filter(b=>b.v>=b.g).length;
  return `<h2>Rozetler · ${got}/${L.length}</h2><div class="card"><div class="macros" style="margin-bottom:8px"><span>🔥 Şu anki seri <b>${s.cur} gün</b></span><span>En uzun seri <b>${s.best} gün</b></span></div><div class="bd">${L.map(b=>`<div class="b ${b.v>=b.g?"on":""}" title="${esc(b.ds)}"><i>${b.ic}</i><b>${esc(b.n)}</b><small>${b.v>=b.g?"Kazanıldı":Math.min(b.v,b.g)+" / "+b.g}</small></div>`).join("")}</div></div>`;
}

  <h2>Son antrenmanlar</h2><div class="card">${wd.length?wd.map(d=>`<div class="item"><div class="n"><b>${d}</b><small>${[...(D.work[d]||[]).map(e=>esc(e.ex)+" "+e.sets+"×"+e.reps+(e.kg?" · "+e.kg+" kg":"")),...((D.cf||{})[d]||[]).map(cfShort)].join("<br>")}</small></div></div>`).join(""):`<div class="empty">Kayıt yok.</div>`}</div>
  <h2>Son beslenme</h2><div class="card">${md.length?md.map(d=>{const L=D.meals[d],k=L.reduce((a,x)=>a+x.kcal,0),pp=L.reduce((a,x)=>a+x.p,0);return `<div class="item"><div class="n"><b>${d}</b> · ${k} kcal · P ${r1(pp)} g<small>${L.map(x=>esc(x.name)+" "+x.g+" g").join(", ")}</small></div></div>`}).join(""):`<div class="empty">Kayıt yok.</div>`}</div>
  <h2>Fotoğraflar</h2><div class="card"><div class="pg" id="mpg">Yükleniyor...</div></div>
  <h2>Üyeye not</h2><div class="card"><textarea id="ntT" rows="3" placeholder="Örn. Bu hafta bacak gününü 4 sete çıkar">${esc(nt?nt.text:"")}</textarea><small style="color:var(--mut)">${nt?(nt.read?"Üye okudu":"Üye henüz okumadı"):"Not yok"}. Boş bırakıp kaydedersen not silinir.</small><div class="err" id="ntE"></div><button class="pri" id="ntS" style="width:100%">Notu gönder</button></div>
  <h2>Antrenman programı</h2><div class="card"><div class="row"><button id="mpAdd">+ Listeden hareket ekle</button><button id="mpDay">+ Gün başlığı</button></div><div class="row"><select id="mpTs" style="flex:1.6">${allTpl().map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join("")}</select><button id="mpTl">Şablonu ekle</button></div><div class="row"><select id="mpWs" style="flex:1.6">${CFW.map((w,i)=>`<option value="${i}">${esc(w[0])} · ${esc(fmtName(w[2]))}</option>`).join("")}</select><button id="mpWl">WOD'u ekle</button></div><textarea id="mpT" rows="8" placeholder="# Göğüs günü&#10;Bench press 4x8&#10;Incline press 3x10&#10;# Bacak günü&#10;Squat 5x5">${esc(pt||"")}</textarea><small style="color:var(--mut)"># ile gün başlığı, hareketleri "Hareket 4x8" biçiminde yaz. Yukarıdaki butonlarla listeden, şablondan veya CrossFit WOD listesinden ekleyebilir, sonra metni düzenleyebilirsin.</small><div class="err" id="mpE"></div><button class="pri" id="mpS" style="width:100%">Programı kaydet</button></div>
  <h2>Beslenme programı</h2><div class="card"><b>Öğün planı (yemek listesinden)</b><div id="dmL" style="margin:8px 0"></div><input id="dmN" list="fl2" placeholder="Yiyecek ara (örn. Yulaf)" style="width:100%;margin-bottom:8px"><datalist id="fl2">${Object.keys(allFoods()).sort().map(n=>`<option value="${esc(n)}">`).join("")}</datalist><div class="row"><input id="dmG" type="number" inputmode="decimal" placeholder="Miktar"><select id="dmU" style="flex:1.6"><option value="1">gram</option></select></div><select id="dmM" style="width:100%;margin-bottom:8px">${MEALS.map(x=>`<option>${x}</option>`).join("")}</select><div class="prev" id="dmP"></div><div class="row"><button id="dmA" class="pri">Plana ekle</button><button id="dmCalc">Hedefleri plandan hesapla</button></div></div><div class="card"><div class="grid"><label class="fld"><small>Kalori hedefi</small><input id="dK" type="number" inputmode="numeric" value="${dt&&dt.kcal||""}"></label><label class="fld"><small>Protein (g)</small><input id="dP" type="number" inputmode="numeric" value="${dt&&dt.p||""}"></label><label class="fld"><small>Karbonhidrat (g)</small><input id="dC" type="number" inputmode="numeric" value="${dt&&dt.c||""}"></label><label class="fld"><small>Yağ (g)</small><input id="dF" type="number" inputmode="numeric" value="${dt&&dt.f||""}"></label></div><textarea id="dT" rows="7" style="margin-top:8px" placeholder="Ek notlar (örn. günde 3 litre su iç)">${esc((dt&&dt.text)||"")}</textarea><div class="err" id="dE"></div><button class="pri" id="dS" style="width:100%">Beslenme programını kaydet</button></div>
  ${m.self?"":`<h2>Şifre</h2><div class="card"><input id="rpN" type="text" autocomplete="off" placeholder="Yeni şifre (en az 6 karakter)" style="width:100%;margin-bottom:8px"><div class="err" id="rpE"></div><button id="rpS" style="width:100%">Şifreyi sıfırla</button><small style="color:var(--mut)">Üyenin diğer cihazlardaki oturumları kapanır, yeni şifreyle girer.</small></div><h2>Hesap</h2><div class="card"><button id="acDl" style="width:100%;margin-bottom:8px">Üyenin verisini indir (yedek)</button><button id="acA" style="width:100%;margin-bottom:8px">${m.disabled?"Hesabı aktifleştir":"Hesabı pasife al"}</button><button id="acD" style="width:100%;color:var(--bad)">Üyeyi kalıcı sil</button><div class="err" id="acE"></div><small style="color:var(--mut)">Pasife alınan üye giriş yapamaz, kayıtları durur. Silme geri alınamaz.</small></div>`}
  ${badgeCard(D)}`;
  $("mBack").onclick=back;
  document.querySelectorAll("#t-mem .chips button").forEach(b=>b.onclick=()=>{MEM.cm=b.dataset.k;renderMem()});
  const say=(id,ok,msg)=>{$(id).style.color=ok?"var(--ac)":"var(--bad)";$(id).textContent=msg};
  const mpApp=L=>{const ta=$("mpT"),v=ta.value.replace(/\s+$/,"");ta.value=(v?v+"\n":"")+L.join("\n")+"\n";ta.scrollTop=ta.scrollHeight};
  $("mpAdd").onclick=()=>pickEx(n=>mpApp([n+" 3x10"]));
  $("mpDay").onclick=()=>mpApp(["# Yeni gün"]);
  $("mpTl").onclick=()=>{const t=allTpl().find(x=>x.id===$("mpTs").value);if(!t)return;mpApp(["# "+t.name.replace(/ \(benim\)$/,""),...t.items.map(i=>i.ex+" "+i.sets+"x"+i.reps)])};
  $("mpWl").onclick=()=>{const w=CFW[+$("mpWs").value];if(!w)return;mpApp([cfLine(w[0],w[2],{...CFDEF,...FD[w[2]],...w[3]},w[4].map(([ex,reps,load])=>({ex,reps,load})),w[5]||"")])};
  $("mpS").onclick=async()=>{try{const t=$("mpT").value;await api("setprogram",{email:E,text:t});MEM.pack.pt=t;if(m.self)PROG=t;say("mpE",1,"Program kaydedildi")}catch(e){say("mpE",0,e.message)}};
  if(!MEM.dm||MEM.dmE!==E){MEM.dm=((dt&&dt.meals)||[]).map(m=>({name:m.name,items:m.items.map(i=>({...i}))}));MEM.dmE=E}
  const dmTot=()=>MEM.dm.reduce((a,m)=>m.items.reduce((b,i)=>({kcal:b.kcal+i.kcal,p:b.p+i.p,c:b.c+i.c,f:b.f+i.f}),a),{kcal:0,p:0,c:0,f:0});
  const dmDraw=()=>{
    $("dmL").innerHTML=MEM.dm.length?MEM.dm.map((m,i)=>`<div class="item" style="border:0"><div class="n"><b>${esc(m.name)}</b><small>${m.items.reduce((a,x)=>a+x.kcal,0)} kcal</small></div></div>`+m.items.map((x,j)=>`<div class="item"><div class="n">${esc(x.n)} · ${x.q?esc(x.q)+" ("+x.g+" g)":x.g+" g"}<small>${x.kcal} kcal · P ${x.p} · K ${x.c} · Y ${x.f}</small></div><button class="x" data-i="${i}" data-j="${j}">Sil</button></div>`).join("")).join("")+`<small style="color:var(--mut)">Toplam: ${dmTot().kcal} kcal · P ${r1(dmTot().p)} · K ${r1(dmTot().c)} · Y ${r1(dmTot().f)}</small>`:`<div class="empty">Henüz öğün eklenmedi.</div>`;
    document.querySelectorAll("#dmL .x").forEach(b=>b.onclick=()=>{const m=MEM.dm[+b.dataset.i];m.items.splice(+b.dataset.j,1);if(!m.items.length)MEM.dm.splice(+b.dataset.i,1);dmDraw()});
  };
  const dmG=()=>(+$("dmG").value||0)*(+$("dmU").value||1);
  const dmUpd=()=>{const r=calc($("dmN").value,dmG());$("dmP").textContent=r?`${Math.round(dmG())} g · ${r.kcal} kcal · P ${r.p} · K ${r.c} · Y ${r.f}`:""};
  $("dmN").oninput=()=>{const U=PORT[$("dmN").value]||[];$("dmU").innerHTML=U.map(([l,g])=>`<option value="${g}">${esc(l.replace(/^1 /,""))} (${g} g)</option>`).join("")+`<option value="1">gram</option>`;if(U.length)$("dmU").value=String(U[0][1]);dmUpd()};
  $("dmG").oninput=dmUpd;$("dmU").onchange=dmUpd;
  $("dmA").onclick=()=>{
    const n=$("dmN").value,q=+$("dmG").value,u=+$("dmU").value||1,g=Math.round(q*u*10)/10,r=calc(n,g);
    if(!r)return say("dE",0,"Bu yiyecek listede yok");if(!q)return say("dE",0,"Miktar gir");
    const P=(PORT[n]||[]).find(x=>x[1]===u),it={n,g,...(P?{q:q+" "+P[0].replace(/^1 /,"")}:{}),...r},mn=$("dmM").value;
    let m=MEM.dm.find(x=>x.name===mn);if(!m){m={name:mn,items:[]};MEM.dm.push(m);MEM.dm.sort((a,b)=>MEALS.indexOf(a.name)-MEALS.indexOf(b.name))}
    m.items.push(it);$("dmN").value="";$("dmG").value="";$("dmP").textContent="";say("dE",1,"");dmDraw();
  };
  $("dmCalc").onclick=()=>{const t=dmTot();$("dK").value=Math.round(t.kcal);$("dP").value=Math.round(t.p);$("dC").value=Math.round(t.c);$("dF").value=Math.round(t.f)};
  dmDraw();
  $("dS").onclick=async()=>{try{const x={kcal:$("dK").value,p:$("dP").value,c:$("dC").value,f:$("dF").value,text:$("dT").value,meals:MEM.dm};await api("setdiet",{email:E,diet:x});MEM.pack.dt={kcal:+x.kcal||0,p:+x.p||0,c:+x.c||0,f:+x.f||0,text:x.text,meals:MEM.dm.map(m=>({name:m.name,items:m.items.map(i=>({...i}))}))};if(m.self)DIET=undefined;say("dE",1,"Beslenme programı kaydedildi")}catch(e){say("dE",0,e.message)}};
  if($("rpS"))$("rpS").onclick=async()=>{try{await api("setpw",{email:E,password:$("rpN").value});$("rpN").value="";say("rpE",1,"Şifre değiştirildi, üyeye ilet")}catch(e){say("rpE",0,e.message)}};
  $("ntS").onclick=async()=>{try{const t=$("ntT").value;await api("setnote",{email:E,text:t});MEM.pack.nt=t.trim()?{text:t.trim(),read:false}:null;say("ntE",1,t.trim()?"Not gönderildi":"Not silindi")}catch(e){say("ntE",0,e.message)}};
  if($("acDl"))$("acDl").onclick=()=>dl("move-"+E.replace(/[^a-z0-9]/gi,"_")+"-yedek.json",{app:"move",v:1,exported:new Date().toISOString(),email:E,data:D,program:pt,diet:dt});
  if($("acA"))$("acA").onclick=async()=>{try{await api("setactive",{email:E,active:!!m.disabled});m.disabled=!m.disabled;MEM.list=null;renderMem()}catch(e){say("acE",0,e.message)}};
  if($("acD"))$("acD").onclick=async()=>{if(!confirm("Bu üye ve bütün kayıtları kalıcı olarak silinecek. Emin misin?"))return;try{await api("deluser",{email:E});back()}catch(e){say("acE",0,e.message)}};
  loadMemPhotos(E);
}

/* ---------- Hesap ---------- */
async function renderAcc(){
  $("t-acc").innerHTML=`<h1>Hesap</h1><div class="card"><div class="item"><div class="n">${esc(SES.email)}<small>${SES.admin?"Yönetici":"Kullanıcı"}</small></div></div><button id="out" style="width:100%">Çıkış yap</button></div>${SES.admin?`<h2>Şifre</h2><div class="card"><small style="color:var(--mut)">Yönetici şifren Vercel'deki ADMIN_PASSWORD ayarında durur. Değiştirmek için Vercel > Settings > Environment Variables bölümünden güncelle ve yeniden yayınla (Redeploy). Üyelerin şifresini Üyeler sekmesinden sıfırlayabilirsin.</small></div>`:`<h2>Şifre değiştir</h2><div class="card"><input id="pwC" type="password" autocomplete="current-password" placeholder="Mevcut şifre" style="width:100%;margin-bottom:8px"><input id="pwN" type="password" autocomplete="new-password" placeholder="Yeni şifre (en az 6 karakter)" style="width:100%;margin-bottom:8px"><input id="pwR" type="password" autocomplete="new-password" placeholder="Yeni şifre (tekrar)" style="width:100%"><div class="err" id="pwE"></div><button class="pri" id="pwS" style="width:100%">Şifreyi değiştir</button></div>`}<h2>Yedek</h2><div class="card"><button id="bkDl" style="width:100%;margin-bottom:8px">Verilerimi indir</button><label class="fld"><small>Yedekten geri yükle (.json)</small><input id="bkUp" type="file" accept=".json,application/json"></label><div class="err" id="bkE"></div></div>`+(SES.admin?`<div class="card"><b>Yeni kullanıcı ekle</b><div class="row" style="margin:8px 0"><input id="nNm" placeholder="Ad"><input id="nSn" placeholder="Soyad"></div><input id="nEm" type="email" placeholder="E-posta" style="width:100%;margin-bottom:8px"><input id="nPw" type="text" placeholder="Şifre (en az 6 karakter)" style="width:100%;margin-bottom:8px"><div class="err" id="nErr"></div><button class="pri" id="nAdd" style="width:100%">Kullanıcıyı ekle</button></div><div class="card"><b>Kullanıcılar</b><div id="ulist" class="empty">Yükleniyor...</div></div>`:"");
  $("out").onclick=logout;
  $("bkDl").onclick=()=>dl("move-yedek-"+isoD(new Date())+".json",{app:"move",v:1,exported:new Date().toISOString(),email:SES.email,data:S});
  $("bkUp").onchange=()=>{
    const f=$("bkUp").files[0];if(!f)return;const r=new FileReader(),e=$("bkE");
    r.onload=()=>{try{
      const o=JSON.parse(r.result);if(!o||!o.data||typeof o.data!=="object")throw 0;
      if(!confirm("Mevcut kayıtların bu yedekle değiştirilecek. Devam edilsin mi?"))return;
      S=Object.assign(EMPTY(),o.data);CHK.forEach(k=>{S[k]=S[k]||{}});fixS();save();e.style.color="var(--ac)";e.textContent="Yedek yüklendi"
    }catch(x){e.style.color="var(--bad)";e.textContent="Geçersiz yedek dosyası"}};
    r.readAsText(f);
  };
  if($("pwS"))$("pwS").onclick=async()=>{
    const e=$("pwE"),say=(ok,m)=>{e.style.color=ok?"var(--ac)":"var(--bad)";e.textContent=m};
    if($("pwN").value!==$("pwR").value)return say(0,"Yeni şifreler aynı değil");
    try{const j=await api("changepw",{current:$("pwC").value,password:$("pwN").value});SES.token=j.token;localStorage.setItem(TK,JSON.stringify(SES));$("pwC").value="";$("pwN").value="";$("pwR").value="";say(1,"Şifre değiştirildi. Diğer cihazlarda yeniden giriş yapman gerekir.")}
    catch(x){say(0,x.message)}
  };
  if(!SES.admin)return;
  const list=async()=>{try{const j=await api("users");$("ulist").innerHTML=j.users.length?j.users.map(u=>`<div class="item"><div class="n">${esc(u)}</div></div>`).join(""):"Henüz kullanıcı yok."}catch(e){$("ulist").textContent=e.message}};
  list();
  $("nAdd").onclick=async()=>{
    $("nErr").textContent="";
    try{await api("adduser",{name:$("nNm").value,surname:$("nSn").value,email:$("nEm").value,password:$("nPw").value});$("nNm").value="";$("nSn").value="";$("nEm").value="";$("nPw").value="";$("nErr").style.color="var(--ac)";$("nErr").textContent="Kullanıcı eklendi";list()}
    catch(e){$("nErr").style.color="var(--bad)";$("nErr").textContent=e.message}
  };
}

/* ---------- Giriş sahnesi (kare kare dalga) ---------- */
(function(){
  const I=[
   '<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="7"><circle cx="50" cy="50" r="42"/><circle cx="50" cy="50" r="27"/><circle cx="50" cy="50" r="8" fill="currentColor"/></svg>',
   '<svg viewBox="0 0 160 60" fill="currentColor"><rect x="4" y="8" width="16" height="44" rx="4"/><rect x="24" y="14" width="14" height="32" rx="4"/><rect x="38" y="26" width="84" height="8" rx="3"/><rect x="122" y="14" width="14" height="32" rx="4"/><rect x="140" y="8" width="16" height="44" rx="4"/></svg>',
   '<svg viewBox="0 0 100 110" fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round"><path d="M32 40C28 8 72 8 68 40"/><circle cx="50" cy="72" r="30" fill="currentColor" stroke="none"/></svg>'
  ];
  function build(){
    const W=typeof innerWidth==="number"?innerWidth:390,H=typeof innerHeight==="number"?innerHeight:800,z=W>=900?100:62;
    const cols=Math.max(3,Math.round(W/z)),rows=Math.max(3,Math.round(H/z)),f=$("fx");
    f.style.gridTemplateColumns=`repeat(${cols},1fr)`;f.style.gridTemplateRows=`repeat(${rows},1fr)`;
    let h="";
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const n=r*cols+c;h+=`<i style="--d:${((c+r)*.2).toFixed(2)}s">${(n*7+r*3)%9===0?I[(n+r)%3]:""}</i>`}
    f.innerHTML=h;
  }
  build();
  if(typeof addEventListener==="function"){let t;addEventListener("resize",()=>{clearTimeout(t);t=setTimeout(build,300)})}
})();

/* ---------- Giriş ---------- */
$("lGo").onclick=async()=>{
  $("lErr").textContent="";
  try{
    const j=await api("login",{email:$("lEm").value,password:$("lPw").value});
    SES={token:j.token,email:j.email,admin:j.admin,name:j.name||"",surname:j.surname||""};tab="home";localStorage.setItem(TK,JSON.stringify(SES));
    $("lPw").value="";start();
  }catch(e){$("lErr").textContent=e.message}
};
async function start(){
  if(!SES){$("login").hidden=false;return}
  $("login").hidden=true;
  const c=localStorage.getItem("move-data-"+SES.email);
  S=c?JSON.parse(c):EMPTY();fixS();render();
  try{
    const j=await api("loadx"),mo=j.months||{};
    if(j.core||Object.keys(mo).length){
      S=Object.assign(EMPTY(),j.core||{});CHK.forEach(k=>{S[k]=Object.assign({},S[k]||{})});
      Object.keys(mo).sort().forEach(m=>CHK.forEach(k=>Object.assign(S[k],(mo[m]||{})[k]||{})));
      const legacy=!!j.core&&CHK.some(k=>j.core[k]&&Object.keys(j.core[k]).length);
      fixS();SYNC={core:legacy?null:JSON.stringify(splitS().core),months:{}};
      Object.keys(mo).forEach(m=>SYNC.months[m]=JSON.stringify(mo[m]));
      localStorage.setItem("move-data-"+SES.email,JSON.stringify(S));
      if(legacy)flush();
    }else{
      if(SES.admin&&localStorage.getItem(LEGACY))S=JSON.parse(localStorage.getItem(LEGACY));
      fixS();SYNC={core:null,months:{}};flush();
    }
    fixS();$("sync").textContent="";render();
  }catch(e){$("sync").textContent="Çevrimdışı, kayıtlar telefondan gösteriliyor"}
}
start();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
